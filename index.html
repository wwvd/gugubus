<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍄 Gugubus 菇專用香港巴士實時到站查詢</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 可愛圓體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', system-ui, -apple-system, sans-serif;
    }
    .mushroom-gradient {
      background: linear-gradient(135deg, #8c533e 0%, #b36b4d 50%, #d9825b 100%);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="bg-[#FAF6F0] min-h-screen text-[#4A3B32] antialiased">

  <!-- Header -->
  <header class="mushroom-gradient text-amber-50 p-4 shadow-lg sticky top-0 z-50 rounded-b-2xl">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <button id="backBtn" class="hidden text-sm bg-[#5C3627]/40 hover:bg-[#5C3627]/60 text-amber-100 px-3 py-1.5 rounded-full transition-all border border-amber-200/30 flex items-center gap-1 shadow-sm" onclick="showRouteList()">
          <span>🍄</span>
          <span>返回路線</span>
        </button>
        <h1 class="text-lg md:text-xl font-black tracking-wide flex items-center gap-2 drop-shadow-sm" id="appTitle">
          <span>🍄</span>
          <span>Gugubus 菇專用全港巴士實時到站</span>
        </h1>
      </div>
      <span class="text-xs bg-amber-100/20 text-amber-100 px-2.5 py-1 rounded-full border border-amber-100/30 hidden sm:inline-block">
        小菇陪伴你搭車 🚌
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4">

    <!-- Selected Route / ETA Card -->
    <div id="infoCard" class="hidden bg-[#FFFDF9] p-5 rounded-2xl shadow-md mb-4 border-2 border-[#EADBC8] transition-all">
      <div class="flex justify-between items-start mb-2">
        <div id="selectedRouteHeader" class="flex items-center space-x-2"></div>
        <button id="switchDirBtn" onclick="toggleDirection()" class="text-xs bg-[#F4ECE1] hover:bg-[#E8DCCB] text-[#8C533E] border border-[#D8C4B0] px-3 py-1.5 rounded-full font-bold transition flex items-center space-x-1 shadow-sm hover:scale-105 active:scale-95">
          <span>切換方向</span>
          <span class="text-sm">⇄</span>
        </button>
      </div>
      <div id="selectedRouteDir" class="text-sm font-semibold text-[#8C7A6B] mb-3"></div>
      
      <div id="selectedStopInfo" class="text-base font-bold text-[#5C4A3E] border-t border-[#F0E6D8] pt-3 flex items-center gap-1">
        請選擇下方車站
      </div>
      
      <!-- ETA Badges Container -->
      <div id="etaContainer" class="mt-3 flex flex-wrap gap-2.5"></div>
    </div>

    <!-- Search and Filter Section -->
    <div id="searchSection" class="bg-[#FFFDF9] p-4 rounded-2xl shadow-sm mb-4 border border-[#EADBC8] space-y-3">
      <!-- Filter Buttons -->
      <div class="flex flex-wrap gap-2">
        <button onclick="setCompanyFilter('ALL')" id="filterAll" class="px-4 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#8C533E] text-amber-50 shadow-sm transition">全部</button>
        <button onclick="setCompanyFilter('KMB')" id="filterKmb" class="px-4 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#F0E6D8] text-[#7A6251] hover:bg-[#E2D2C0] transition">九巴/龍運</button>
        <button onclick="setCompanyFilter('CTB')" id="filterCtb" class="px-4 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#F0E6D8] text-[#7A6251] hover:bg-[#E2D2C0] transition">城巴</button>
      </div>

      <!-- Live Load Status -->
      <div id="statusTag" class="text-xs font-bold text-[#8C6D58] flex items-center justify-between">
        <span id="statusText">🍄 菇菇熱門路線已就緒！</span>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="searchInput" oninput="filterRoutes()" placeholder="搜尋路線或地名 (例如 1, 1A, 101, 118, 960, 觀塘, 屯門)..." 
          class="w-full px-4 py-2.5 bg-[#FAF6F0] border-2 border-[#E2D2C0] rounded-xl focus:outline-none focus:border-[#8C533E] focus:bg-white text-sm font-semibold text-[#4A3B32] placeholder-[#A8988B] transition">
        <span class="absolute right-3.5 top-2.5 text-base">🔍</span>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="hidden flex-col items-center justify-center py-16">
      <div class="text-4xl animate-bounce mb-2">🍄</div>
      <p id="loadingMsg" class="text-[#8C6D58] font-bold text-sm tracking-wider">小菇正在讀取資料中...</p>
    </div>

    <!-- Route List View -->
    <div id="routeListView" class="space-y-2.5"></div>

    <!-- Stop List View -->
    <div id="stopListView" class="hidden space-y-2.5"></div>

  </main>

      { company: 'CTB', companyName: '城巴', route: '118', orig: '長沙灣(深旺道)', dest: '小西灣(藍灣半島)', bound: 'outbound' },

      { company: 'CTB', companyName: '城巴', route: '619', orig: '順利', dest: '中環(港澳碼頭)', bound: 'outbound' },
      { company: 'KMB', companyName: '九巴/龍運', route: '960', orig: '屯門(建生邨)', dest: '灣仔北', bound: 'outbound', serviceType: '1' },
      { company: 'KMB', companyName: '九巴/龍運', route: '968', orig: '元朗(西)', dest: '銅鑼灣(天后)', bound: 'outbound', serviceType: '1' }
    ];

    let selectedCompanyFilter = 'ALL';
    let currentSelectedRoute = null;

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (loader) {
        if (isLoading) loader.classList.remove('hidden');
        else loader.classList.add('hidden');
      }
    }

    function initApp() {
      filterRoutes();
      showLoading(false);
    }

    function getCompanyBadgeStyle(code) {
      switch (code) {
        case 'KMB': return 'bg-[#D9534F] text-white';
        case 'CTB': return 'bg-[#F0AD4E] text-[#332211]';
        default: return 'bg-[#8C533E] text-white';
      }
    }

    function renderRoutes(routes) {
      const container = document.getElementById('routeListView');
      if (!container) return;
      container.innerHTML = '';

      if (!routes || routes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-[#FFFDF9] rounded-2xl border border-[#EADBC8] p-6">
            <span class="text-3xl block mb-2">🍄💧</span>
            <p class="text-[#8C6D58] font-bold">找不到相關路線喔～換個關鍵字搜尋看看吧！</p>
          </div>`;
        return;
      }

      routes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-[#FFFDF9] hover:bg-[#FDF9F3] p-4 rounded-2xl shadow-sm border border-[#EADBC8] hover:border-[#D8C4B0] hover:shadow-md transition-all cursor-pointer flex justify-between items-center group transform hover:-translate-y-0.5";
        card.onclick = () => selectRoute(r);

        const badgeStyle = getCompanyBadgeStyle(r.company);

        card.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="px-2 py-0.5 rounded-lg font-black text-[11px] ${badgeStyle} shadow-sm">
              ${r.companyName}
            </span>
            <span class="text-xl font-black text-[#4A3B32] group-hover:text-[#8C533E] transition pl-1">${r.route}</span>
          </div>
          <div class="text-xs md:text-sm font-bold text-[#8C7A6B] flex items-center gap-1">
            <span>${r.orig}</span>
            <span class="text-[#D9825B]">➔</span>
            <span>${r.dest}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterRoutes() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();

      const filtered = ROUTES_DB.filter(r => {
        const matchesCompany = selectedCompanyFilter === 'ALL' || r.company === selectedCompanyFilter;
        if (!matchesCompany) return false;

        if (!query) return true;

        return r.route.toUpperCase().includes(query) ||
               r.orig.toUpperCase().includes(query) ||
               r.dest.toUpperCase().includes(query);
      });

      renderRoutes(filtered);
    }

    function setCompanyFilter(company) {
      selectedCompanyFilter = company;
      ['All', 'Kmb', 'Ctb'].forEach(type => {
        const btn = document.getElementById(`filter${type}`);
        if (btn) {
          if (type.toUpperCase() === company || (type === 'All' && company === 'ALL')) {
            btn.className = "px-4 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#8C533E] text-amber-50 shadow-sm transition";
          } else {
            btn.className = "px-4 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#F0E6D8] text-[#7A6251] hover:bg-[#E2D2C0] transition";
          }
        }
      });
      filterRoutes();
    }

    async function selectRoute(route) {
      currentSelectedRoute = JSON.parse(JSON.stringify(route));

      document.getElementById('routeListView')?.classList.add('hidden');
      document.getElementById('searchSection')?.classList.add('hidden');
      document.getElementById('backBtn')?.classList.remove('hidden');
      
      const appTitle = document.getElementById('appTitle');
      if (appTitle) appTitle.innerHTML = `<span>🍄</span><span>${route.companyName} ${route.route} 車站列表</span>`;

      const infoCard = document.getElementById('infoCard');
      if (infoCard) infoCard.classList.remove('hidden');

      const badgeStyle = getCompanyBadgeStyle(route.company);
      const header = document.getElementById('selectedRouteHeader');
      if (header) {
        header.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="px-2 py-0.5 rounded-lg font-black text-xs ${badgeStyle}">
              ${route.companyName}
            </span>
            <span class="text-xl font-black text-[#4A3B32]">${route.route}</span>
          </div>
        `;
      }

      const dir = document.getElementById('selectedRouteDir');
      if (dir) dir.textContent = `${route.orig} ➔ ${route.dest}`;

      const stopInfo = document.getElementById('selectedStopInfo');
      if (stopInfo) stopInfo.innerHTML = `<span>🍄</span><span>請選擇下方車站查看實時到站時間</span>`;

      const etaBox = document.getElementById('etaContainer');
      if (etaBox) etaBox.innerHTML = "";

      showLoading(true);
      document.getElementById('stopListView')?.classList.add('hidden');

      try {
        let stopsRaw = [];

        if (route.company === 'KMB') {
          const bound = route.bound === 'inbound' ? 'inbound' : 'outbound';
          const res = await fetch(`${KMB_BASE}/route-stop/${route.route}/${bound}/${route.serviceType || '1'}`);
          const data = await res.json();
          stopsRaw = data.data || [];
        } else if (route.company === 'CTB') {
          const res = await fetch(`${CTB_BASE}/route-stop/ctb/${route.route}/outbound`);
          const data = await res.json();
          stopsRaw = data.data || [];
        }

        if (stopsRaw.length === 0) {
          stopsRaw.push({ seq: 1, stop: 'DEFAULT' });
        }

        const stopPromises = stopsRaw.map(async (s, idx) => {
          let name = `巴士站 ${s.seq || idx + 1}`;
          if (s.stop && s.stop !== 'DEFAULT') {
            const apiBase = route.company === 'KMB' ? KMB_BASE : CTB_BASE;
            try {
              const stopRes = await fetch(`${apiBase}/stop/${s.stop}`);
              const stopData = await stopRes.json();
              if (stopData && stopData.data && stopData.data.name_tc) {
                name = stopData.data.name_tc;
              }
            } catch (e) {}
          }
          return {
            seq: s.seq || (idx + 1),
            name: name,
            stopId: s.stop
          };
        });

        const stops = (await Promise.all(stopPromises)).sort((a, b) => a.seq - b.seq);
        renderStops(stops);
      } catch (err) {
