    let allRoutes = [...BUILTIN_ROUTES];
    let selectedCompanyFilter = 'ALL';
    let currentSelectedRoute = null;

    function updateStatus(msg, countText) {
      const elText = document.getElementById('statusText');
      const elCount = document.getElementById('debugCount');
      if (elText) elText.textContent = msg;
      if (elCount && countText) elCount.textContent = countText;
    }

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (loader) {
        if (isLoading) loader.classList.remove('hidden');
        else loader.classList.add('hidden');
      }
    }

    async function fetchWithTimeout(url, timeoutMs = 6000) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (!response || !response.ok) return null;
        return await response.json();
      } catch (e) {
        return null;
      }
    }

    function initApp() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', filterRoutes);
        searchInput.addEventListener('keyup', filterRoutes);
      }

      updateStatus("🍄 內建路線庫就緒", `${allRoutes.length} 條路線`);
      filterRoutes();
      showLoading(false);
      setTimeout(syncLiveRoutes, 500);
    }

    async function syncLiveRoutes() {
      try {
        const [kmbRes, ctbRes] = await Promise.all([
          fetchWithTimeout(`${KMB_BASE}/route`, 8000),
          fetchWithTimeout(`${CTB_BASE}/route/ctb`, 8000)
        ]);

        let liveList = [];

        if (kmbRes && Array.isArray(kmbRes.data)) {
          kmbRes.data.forEach(r => {
            const rName = safeStr(r.route).toUpperCase();
            if (!rName) return;
            liveList.push({
              company: 'KMB',
              companyName: '九巴/龍運',
              route: rName,
              orig: safeStr(r.orig_tc || r.origTc, '起點'),
              dest: safeStr(r.dest_tc || r.destTc, '終點'),
              bound: safeStr(r.bound, 'O').toUpperCase() === 'I' ? 'inbound' : 'outbound',
              serviceType: safeStr(r.service_type, '1')
            });
          });
        }

        if (ctbRes && Array.isArray(ctbRes.data)) {
          ctbRes.data.forEach(r => {
            const rName = safeStr(r.route).toUpperCase();
            if (!rName) return;
            liveList.push({
              company: 'CTB',
              companyName: '城巴',
              route: rName,
              orig: safeStr(r.orig_tc || r.origTc, '起點'),
              dest: safeStr(r.dest_tc || r.destTc, '終點'),
              bound: 'outbound',
              serviceType: '1'
            });
          });
        }

        if (liveList.length > 50) {
          allRoutes = liveList;
          filterRoutes();
          updateStatus("🍄 全港最新路線已同步", `${allRoutes.length} 條`);
        }
      } catch (err) {
        console.error("Background sync notice:", err);
      }
    }

    function getCompanyBadgeStyle(code) {
      switch (code) {
        case 'KMB': return 'bg-[#D9534F] text-white';
        case 'CTB': return 'bg-[#F0AD4E] text-[#332211]';
        default: return 'bg-[#8C533E] text-white';
      }
    }

    function renderRoutes(routes, totalMatches = 0) {
      const container = document.getElementById('routeListView');
      if (!container) return;
      container.innerHTML = '';

      if (!routes || !Array.isArray(routes) || routes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-[#FFFDF9] rounded-2xl border border-[#EADBC8] p-6">
            <span class="text-3xl block mb-2">🍄💧</span>
            <p class="text-[#8C6D58] font-bold">找不到相關路線喔～Try 搜尋其他號碼或地名吧！</p>
          </div>`;
        return;
      }

      routes.forEach(r => {
        if (!r || !r.route) return;
        const card = document.createElement('div');
        card.className = "bg-[#FFFDF9] hover:bg-[#FDF9F3] p-4 rounded-2xl shadow-sm border border-[#EADBC8] hover:border-[#D8C4B0] hover:shadow-md transition-all cursor-pointer flex justify-between items-center group transform hover:-translate-y-0.5";
        card.onclick = () => selectRoute(r);

        const badgeStyle = getCompanyBadgeStyle(r.company);

        card.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="px-2 py-0.5 rounded-lg font-black text-[11px] ${badgeStyle} shadow-sm">
              ${r.companyName || r.company}
            </span>
            <span class="text-xl font-black text-[#4A3B32] group-hover:text-[#8C533E] transition pl-1">${r.route}</span>
          </div>
          <div class="text-xs md:text-sm font-bold text-[#8C7A6B] flex items-center gap-1">
            <span>${r.orig}</span>
            <span class="text-[#D9825B]">➔</span>
            <span>${r.dest}</span>
          </div>
        `;
        container.appendChild(card);
      });

      updateStatus("🍄 搜尋結果正常", `顯示 ${routes.length} / 符合 ${totalMatches}`);
    }

    function filterRoutes() {
      try {
        const inputEl = document.getElementById('searchInput');
        const rawQuery = safeStr(inputEl ? inputEl.value : '');
        const cleanQuery = cleanStr(rawQuery);

        let source = Array.isArray(allRoutes) && allRoutes.length > 0 ? allRoutes : BUILTIN_ROUTES;

        if (!cleanQuery) {
          const filtered = source.filter(r => 
            r && (selectedCompanyFilter === 'ALL' || r.company === selectedCompanyFilter)
          );
          renderRoutes(filtered.slice(0, 60), filtered.length);
          return;
        }

        const matches = [];

        source.forEach(r => {
          if (!r || !r.route) return;
          const matchesCompany = selectedCompanyFilter === 'ALL' || r.company === selectedCompanyFilter;
          if (!matchesCompany) return;

          const routeClean = cleanStr(r.route);
          const origClean = cleanStr(r.orig);
