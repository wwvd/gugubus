<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gugubus 菇專用香港巴士實時到站查詢 🍄</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 min-h-screen text-stone-800 font-sans">

  <!-- Header -->
  <header class="bg-[#5c3a21] text-amber-100 p-4 shadow-md sticky top-0 z-50 flex justify-between items-center h-[60px] border-b border-[#472c18]">
    <div class="flex items-center space-x-2">
      <button id="backBtn" class="hidden text-sm bg-[#472c18] hover:bg-[#362111] text-amber-200 px-3 py-1.5 rounded-xl transition border border-amber-900/40 flex items-center space-x-1" onclick="showRouteList()">
        <span>←</span>
        <span>返回路線</span>
      </button>
      <h1 class="text-xl font-bold flex items-center space-x-2" id="appTitle">
        <span>🍄</span>
        <span>Gugubus 菇專用香港巴士實時到站查詢</span>
      </h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4">

    <!-- Selected Info Banner (Sticky at top when scrolling stops) -->
    <div id="infoCard" class="hidden sticky top-[60px] z-40 bg-[#fdfbf7]/95 backdrop-blur-md p-4 rounded-2xl shadow-md mb-4 border border-amber-200/80 transition-all">
      <div class="flex justify-between items-start mb-1">
        <div id="selectedRouteHeader" class="flex items-center space-x-2"></div>
        <!-- Direction Switch Button -->
        <button id="switchDirBtn" onclick="toggleDirection()" class="text-xs bg-amber-100/80 hover:bg-amber-200/80 text-amber-900 border border-amber-300 px-3 py-1.5 rounded-xl font-semibold transition flex items-center space-x-1 shadow-sm">
          <span>切換方向</span>
          <span>⇄</span>
        </button>
      </div>
      <div id="selectedRouteDir" class="text-sm text-stone-600 mb-3"></div>
      <div id="selectedStopInfo" class="text-md font-semibold text-stone-800 border-t border-amber-200/60 pt-2">請選擇下方車站</div>
      
      <!-- ETA Badges Container -->
      <div id="etaContainer" class="mt-3 flex flex-wrap gap-2"></div>
    </div>

    <!-- Search Section (Route View Only) -->
    <div id="searchSection" class="bg-white p-4 rounded-2xl shadow-sm border border-amber-200/70 mb-4">
      <input type="text" id="searchInput" oninput="filterRoutes()" placeholder="搜尋路線 (例如 1, 1A, 101, 102, 112, 960, A21, 38X)..." 
        class="w-full px-4 py-2 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700 bg-amber-50/20 placeholder-stone-400">
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="flex flex-col items-center justify-center py-12">
      <div class="text-4xl animate-bounce mb-2">🍄</div>
      <div class="w-10 h-10 border-4 border-amber-700 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-3 text-stone-600 font-medium">載入菇菇巴士數據中 (九巴 / 城巴 / 龍運 / 嶼巴)...</p>
    </div>

    <!-- Route List View -->
    <div id="routeListView" class="space-y-2"></div>

    <!-- Stop List View -->
    <div id="stopListView" class="hidden space-y-2"></div>

  </main>

  <script>
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const CTB_BASE = "https://rt.data.gov.hk/v2/transport/citybus";
    const NLB_BASE = "https://rt.data.gov.hk/v2/transport/nlb";

    let allRoutes = [];
    let currentSelectedRoute = null;
    let currentSelectedStop = null;
    let currentActiveCard = null;
    let autoRefreshTimer = null;

    // Stop caches for instant stop name resolution
    const kmbStopMap = new Map();
    const ctbStopMap = new Map();

    function cleanStopName(name) {
      if (!name) return '';
      return name
        .replace(/（.*?）|\(.*?\)|【.*?】/g, '')
        .replace(/巴士總站|總站|分站|車站|特別班次|循環線|轉乘站|市中心|廣場|大廈|商場|碼頭|邨|屋邨|公園|花園|鐵路站|港鐵站/g, '')
        .replace(/[，, \-_]/g, '')
        .trim();
    }

    // Universal Calendar-Aware Stop Filter for ALL bus routes
    function filterCalendarAwareStops(stops, routeNum) {
      const now = new Date();
      const day = now.getDay();
      const isSunday = (day === 0);

      const checkName = (s, substring) => {
        const kName = s.kmbName || s.name || '';
        const cName = s.ctbName || s.name || '';
        return kName.includes(substring) || cName.includes(substring);
      };

      const hasStatueSquare = stops.some(s => checkName(s, '皇后像廣場'));
      const hasAlexandraOrChaterGarden = stops.some(s => checkName(s, '歷山大廈') || checkName(s, '遮打花園'));

      return stops.filter(s => {
        const kName = s.kmbName || s.name || '';
        const cName = s.ctbName || s.name || '';

        if (hasStatueSquare && hasAlexandraOrChaterGarden) {
          if (!isSunday) {
            if (kName.includes('歷山大廈') || kName.includes('遮打花園') || cName.includes('歷山大廈') || cName.includes('遮打花園')) return false;
          } else {
            if (kName.includes('皇后像廣場') || cName.includes('皇后像廣場')) return false;
          }
        }

        if (!isSunday) {
          if (kName.includes('只限星期日及公眾假期') || cName.includes('只限星期日及公眾假期') ||
              kName.includes('星期日及公眾假期特別') || cName.includes('星期日及公眾假期特別') ||
              kName.includes('星期日及假期') || cName.includes('星期日及假期') ||
              kName.includes('假日特別班') || cName.includes('假日特別班')) {
            return false;
          }
        } else {
          if (kName.includes('星期日及公眾假期除外') || cName.includes('星期日及公眾假期除外') ||
              kName.includes('只限星期一至六') || cName.includes('只限星期一至六') ||
              kName.includes('星期一至六適用') || cName.includes('星期一至六適用')) {
            return false;
          }
        }

        return true;
      });
    }

    function isJointRouteNumber(routeNum) {
      const norm = routeNum.trim().toUpperCase();
      return /^(1\d\d|3\d\d|6\d\d|8\d\d|9\d\d|N1\d\d|N3\d\d|N6\d\d|N8\d\d|N9\d\d|X9\d\d|X1\d\d|[13689]\d\d[A-Z]?|N[13689]\d\d[A-Z]?)$/i.test(norm);
    }

    function isSameRouteGroup(r1, r2) {
      if (r1.route.toUpperCase() !== r2.route.toUpperCase()) return false;

      if (r1.company === r2.company) return true;

      if (!isJointRouteNumber(r1.route)) return false;

      const cOrig1 = cleanStopName(r1.origTc);
      const cDest1 = cleanStopName(r1.destTc);
      const cOrig2 = cleanStopName(r2.origTc);
      const cDest2 = cleanStopName(r2.destTc);

      return (cOrig1 && cOrig2 && (cOrig1.includes(cOrig2) || cOrig2.includes(cOrig1))) ||
             (cDest1 && cDest2 && (cDest1.includes(cDest2) || cDest2.includes(cDest1))) ||
             (cOrig1 && cDest2 && (cOrig1.includes(cDest2) || cDest2.includes(cOrig1))) ||
             (cDest1 && cOrig2 && (cDest1.includes(cOrig2) || cOrig2.includes(cDest1)));
    }

    async function getStopDetail(company, stopId) {
      if (company === 'KMB' || company === 'LWB') {
        if (kmbStopMap.has(stopId)) return kmbStopMap.get(stopId);
        try {
          const res = await fetch(`${KMB_BASE}/stop/${stopId}`).then(r => r.json());
          if (res.data) {
            const info = { name: res.data.name_tc || res.data.name_en, lat: parseFloat(res.data.lat), long: parseFloat(res.data.long) };
            kmbStopMap.set(stopId, info);
            return info;
          }
        } catch (e) {}
      } else if (company === 'CTB') {
        if (ctbStopMap.has(stopId)) return ctbStopMap.get(stopId);
        try {
          const res = await fetch(`${CTB_BASE}/stop/${stopId}`).then(r => r.json());
          if (res.data) {
            const info = { name: res.data.name_tc || res.data.name_en, lat: parseFloat(res.data.lat), long: parseFloat(res.data.long) };
            ctbStopMap.set(stopId, info);
            return info;
          }
        } catch (e) {}
      }
      return { name: `巴士站 ${stopId}`, lat: null, long: null };
    }

    function findBestCtbMatch(kStop, ctbStops) {
      if (!ctbStops || ctbStops.length === 0) return null;

      let bestMatch = null;
      let minDistance = Infinity;

      if (kStop.lat && kStop.long) {
        ctbStops.forEach(cStop => {
          if (cStop.lat && cStop.long) {
            const dLat = kStop.lat - cStop.lat;
            const dLong = kStop.long - cStop.long;
            const distSq = dLat * dLat + dLong * dLong;
            if (distSq < 0.00001 && distSq < minDistance) {
              minDistance = distSq;
              bestMatch = cStop;
            }
          }
        });
      }

      if (bestMatch) return bestMatch;

      const kNorm = cleanStopName(kStop.name);
      if (kNorm.length >= 2) {
        bestMatch = ctbStops.find(cStop => {
          const cNorm = cleanStopName(cStop.name);
          return cNorm.includes(kNorm) || kNorm.includes(cNorm);
        });
      }

      return bestMatch || null;
    }

    window.addEventListener('DOMContentLoaded', fetchAllRoutes);

    async function fetchAllRoutes() {
      showLoading(true);
      try {
        const [kmbRes, ctbRes, nlbRes] = await Promise.all([
          fetch(`${KMB_BASE}/route`).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(`${CTB_BASE}/route/CTB`).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(`${NLB_BASE}/route.php?action=list`).then(r => r.json()).catch(() => ({ routes: [] }))
        ]);

        const kmbRoutes = (kmbRes.data || []).map(r => {
          const isLwb = (r.route && (r.route.startsWith('A') || r.route.startsWith('E') || r.route.startsWith('N') || r.route.startsWith('R') || r.route.startsWith('S'))) && !['101','102','112'].includes(r.route);
          return {
            company: isLwb ? 'LWB' : 'KMB',
            route: r.route ? r.route.trim() : '',
            bound: r.bound,
            serviceType: r.service_type || '1',
            origTc: r.orig_tc,
            destTc: r.dest_tc
          };
        });

        const ctbRoutes = (ctbRes.data || []).map(r => ({
          company: 'CTB',
          route: r.route ? r.route.trim() : '',
          bound: r.bound || 'outbound',
          serviceType: '1',
          origTc: r.orig_tc,
          destTc: r.dest_tc
        }));

        const nlbRoutes = (nlbRes.routes || []).map(r => ({
          company: 'NLB',
          route: r.routeNo ? r.routeNo.trim() : '',
          bound: 'outbound',
          serviceType: '1',
          origTc: r.origNameTC || r.routeNameTC?.split('>')?.[0] || '大嶼山',
          destTc: r.destNameTC || r.routeNameTC?.split('>')?.[1] || '東涌',
          nlbRouteId: r.routeId
        }));

        const combined = [...kmbRoutes, ...ctbRoutes, ...nlbRoutes];
        const routeGroups = [];

        combined.forEach(r => {
          if (!r.route || !r.origTc || !r.destTc) return;
          
          let matchedGroup = routeGroups.find(g => isSameRouteGroup(g, r));
          
          if (!matchedGroup) {
            matchedGroup = {
              route: r.route,
              companies: new Set(),
              variants: [],
              origTc: r.origTc,
              destTc: r.destTc
            };
            routeGroups.push(matchedGroup);
          }
          
          matchedGroup.companies.add(r.company);
          
          const isDuplicateVariant = matchedGroup.variants.some(v => 
            v.company === r.company && v.bound === r.bound && v.serviceType === r.serviceType
          );
          if (!isDuplicateVariant) {
            matchedGroup.variants.push(r);
          }
        });

        allRoutes = routeGroups.map(g => ({
          route: g.route,
          companies: Array.from(g.companies),
          variants: g.variants,
          origTc: g.origTc,
          destTc: g.destTc
        }));

        allRoutes.sort((a, b) => a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' }));
        renderRoutes(allRoutes);
      } catch (err) {
        alert("無法讀取巴士路線資料。");
      } finally {
        showLoading(false);
      }
    }

    function renderRoutes(routes) {
      const container = document.getElementById('routeListView');
      container.innerHTML = '';

      if (routes.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-stone-500">找不到相關路線 🍄</div>`;
        return;
      }

      routes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-amber-200/60 hover:border-amber-500 hover:shadow-md transition cursor-pointer flex justify-between items-center";
        card.onclick = () => selectRoute(r);

        let badgesHtml = '';
        if (r.companies.includes('KMB')) {
          badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-red-600 text-white mr-1 shadow-sm">九巴</span>`;
        }
        if (r.companies.includes('LWB')) {
          badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-teal-700 text-white mr-1 shadow-sm">龍運</span>`;
        }
        if (r.companies.includes('CTB')) {
          badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-amber-400 text-amber-950 mr-1 shadow-sm">城巴</span>`;
        }
        if (r.companies.includes('NLB')) {
          badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-cyan-700 text-white mr-1 shadow-sm">嶼巴</span>`;
        }

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="flex items-center">${badgesHtml}</div>
            <span class="text-lg font-bold text-stone-900">${r.route}</span>
          </div>
          <div class="text-sm text-stone-600 font-medium">${r.origTc} ⇄ ${r.destTc}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterRoutes() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const filtered = allRoutes.filter(r => !query || r.route.toUpperCase().includes(query));
      renderRoutes(filtered);
    }

    async function selectRoute(mergedRoute) {
      stopAutoRefresh();
      const primaryCompany = mergedRoute.companies[0];
      const primaryVariant = mergedRoute.variants.find(v => v.company === primaryCompany) || mergedRoute.variants[0];

      currentSelectedRoute = {
        route: mergedRoute.route,
        companies: mergedRoute.companies,
        primaryCompany: primaryCompany,
        bound: primaryVariant.bound,
        serviceType: primaryVariant.serviceType || '1',
        origTc: primaryVariant.origTc,
        destTc: primaryVariant.destTc,
        variants: mergedRoute.variants,
        dir: (primaryVariant.bound === 'O' || primaryVariant.bound?.toLowerCase() === 'outbound') ? 'outbound' : 'inbound'
      };

      document.getElementById('routeListView').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('appTitle').innerHTML = `<span>🍄</span><span>路線 ${currentSelectedRoute.route} 車站列表</span>`;

      document.getElementById('infoCard').classList.remove('hidden');

      updateInfoCardUI();
      loadStopsForCurrentRoute();
    }

    function updateInfoCardUI() {
      const headerEl = document.getElementById('selectedRouteHeader');
      
      let companyBadges = '';
      if (currentSelectedRoute.companies.includes('KMB')) {
        companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-red-600 text-white">九巴</span>`;
      }
      if (currentSelectedRoute.companies.includes('LWB')) {
        companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-teal-700 text-white">龍運</span>`;
      }
      if (currentSelectedRoute.companies.includes('CTB')) {
        companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-amber-400 text-amber-950">城巴</span>`;
      }
      if (currentSelectedRoute.companies.includes('NLB')) {
        companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-cyan-700 text-white">嶼巴</span>`;
      }

      headerEl.innerHTML = `
        <div class="flex items-center space-x-1">${companyBadges}</div>
        <span class="text-lg font-bold ml-2 text-stone-900">${currentSelectedRoute.route}</span>
      `;

      document.getElementById('selectedRouteDir').textContent = `${currentSelectedRoute.origTc} ➔ ${currentSelectedRoute.destTc}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站查看到站時間";
      document.getElementById('etaContainer').innerHTML = "";
    }

    function toggleDirection() {
      if (!currentSelectedRoute) return;
      stopAutoRefresh();

      const temp = currentSelectedRoute.origTc;
      currentSelectedRoute.origTc = currentSelectedRoute.destTc;
      currentSelectedRoute.destTc = temp;

      currentSelectedRoute.dir = currentSelectedRoute.dir === 'outbound' ? 'inbound' : 'outbound';

      document.getElementById('selectedRouteDir').textContent = `${currentSelectedRoute.origTc} ➔ ${currentSelectedRoute.destTc}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站";
      document.getElementById('etaContainer').innerHTML = "";
      loadStopsForCurrentRoute();
    }

    async function fetchCtbStopDetails(rawStops) {
      return await Promise.all(rawStops.map(async (s) => {
        const info = await getStopDetail('CTB', s.stop);
        return { stopId: s.stop, seq: s.seq, name: info.name, lat: info.lat, long: info.long };
      }));
    }

    async function getMatchingCtbStops(routeNumber, kmbStops) {
      if (!kmbStops || kmbStops.length === 0) return [];
      
      try {
        const [outRes, inRes] = await Promise.all([
          fetch(`${CTB_BASE}/route-stop/CTB/${routeNumber}/outbound`).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(`${CTB_BASE}/route-stop/CTB/${routeNumber}/inbound`).then(r => r.json()).catch(() => ({ data: [] }))
        ]);

        const outStops = outRes.data || [];
        const inStops = inRes.data || [];

        if (outStops.length === 0 && inStops.length === 0) return [];
        if (outStops.length === 0) return await fetchCtbStopDetails(inStops);
        if (inStops.length === 0) return await fetchCtbStopDetails(outStops);

        const kmbFirst = kmbStops[0];
        const [outFirstDetail, inFirstDetail] = await Promise.all([
          getStopDetail('CTB', outStops[0].stop),
          getStopDetail('CTB', inStops[0].stop)
        ]);

        let outDist = Infinity;
        let inDist = Infinity;

        if (kmbFirst.lat && kmbFirst.long) {
          if (outFirstDetail.lat && outFirstDetail.long) {
            outDist = Math.hypot(kmbFirst.lat - outFirstDetail.lat, kmbFirst.long - outFirstDetail.long);
          }
          if (inFirstDetail.lat && inFirstDetail.long) {
            inDist = Math.hypot(kmbFirst.lat - inFirstDetail.lat, kmbFirst.long - inFirstDetail.long);
          }
        }

        const chosenRawStops = (outDist < inDist) ? outStops : inStops;
        return await fetchCtbStopDetails(chosenRawStops);
      } catch (e) {
        return [];
      }
    }

    async function loadStopsForCurrentRoute() {
      showLoading(true);
      document.getElementById('stopListView').classList.add('hidden');

      try {
        const route = currentSelectedRoute;
        const isJoint = route.companies.includes('KMB') && route.companies.includes('CTB');

        let kmbStopsDetailed = [];
        let ctbStopsDetailed = [];
        let nlbStopsDetailed = [];

        if (route.companies.includes('KMB') || route.companies.includes('LWB')) {
          const kmbVar = route.variants.find(v => v.company === 'KMB' || v.company === 'LWB') || {};
          const isOutbound = route.dir === 'outbound';
          const dir = isOutbound ? 'outbound' : 'inbound';
          const res = await fetch(`${KMB_BASE}/route-stop/${route.route}/${dir}/${kmbVar.serviceType || '1'}`).then(r => r.json());
          const rawStops = res.data || [];

          kmbStopsDetailed = await Promise.all(rawStops.map(async (s) => {
            const info = await getStopDetail('KMB', s.stop);
            return { stopId: s.stop, seq: s.seq, name: info.name, lat: info.lat, long: info.long };
          }));
        }

        if (route.companies.includes('CTB')) {
          if (isJoint && kmbStopsDetailed.length > 0) {
            ctbStopsDetailed = await getMatchingCtbStops(route.route, kmbStopsDetailed);
          } else {
            const isOutbound = route.dir === 'outbound';
            const dir = isOutbound ? 'outbound' : 'inbound';
            const res = await fetch(`${CTB_BASE}/route-stop/CTB/${route.route}/${dir}`).then(r => r.json());
            ctbStopsDetailed = await fetchCtbStopDetails(res.data || []);
          }
        }

        if (route.companies.includes('NLB')) {
          const nlbVar = route.variants.find(v => v.company === 'NLB');
          if (nlbVar && nlbVar.nlbRouteId) {
            const res = await fetch(`${NLB_BASE}/stop.php?action=getStop&routeId=${nlbVar.nlbRouteId}`).then(r => r.json()).catch(() => ({ stops: [] }));
            nlbStopsDetailed = (res.stops || []).map((s, idx) => ({
              stopId: s.stopId,
              seq: idx + 1,
              name: s.stopNameTC || s.stopNameEN,
              lat: parseFloat(s.latitude),
              long: parseFloat(s.longitude),
              nlbRouteId: nlbVar.nlbRouteId
            }));
          }
        }

        let finalStops = [];
        if (isJoint && kmbStopsDetailed.length > 0 && ctbStopsDetailed.length > 0) {
          finalStops = kmbStopsDetailed.map((kStop) => {
            const matchedCtb = findBestCtbMatch(kStop, ctbStopsDetailed);
            return {
              seq: kStop.seq,
              name: kStop.name,
              kmbName: kStop.name,
              ctbName: matchedCtb ? matchedCtb.name : null,
              kmbStopId: kStop.stopId,
              ctbStopId: matchedCtb ? matchedCtb.stopId : null
            };
          });
        } else if (kmbStopsDetailed.length > 0) {
          finalStops = kmbStopsDetailed.map(s => ({
            seq: s.seq,
            name: s.name,
            kmbName: s.name,
            ctbName: null,
            kmbStopId: s.stopId,
            ctbStopId: null
          }));
        } else if (ctbStopsDetailed.length > 0) {
          finalStops = ctbStopsDetailed.map(s => ({
            seq: s.seq,
            name: s.name,
            kmbName: null,
            ctbName: s.name,
            kmbStopId: null,
            ctbStopId: s.stopId
          }));
        } else if (nlbStopsDetailed.length > 0) {
          finalStops = nlbStopsDetailed.map(s => ({
            seq: s.seq,
            name: s.name,
            kmbName: null,
            ctbName: null,
            nlbStopId: s.stopId,
            nlbRouteId: s.nlbRouteId
          }));
        }

        finalStops.sort((a, b) => a.seq - b.seq);
        finalStops = filterCalendarAwareStops(finalStops, route.route);

        finalStops.forEach((s, idx) => {
          s.displaySeq = idx + 1;
        });

        renderStops(finalStops);
      } catch (err) {
        alert("無法加載車站列表。");
      } finally {
        showLoading(false);
      }
    }

    function renderStops(stops) {
      const container = document.getElementById('stopListView');
      container.innerHTML = '';
      container.classList.remove('hidden');

      stops.forEach(s => {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl shadow-sm border border-amber-200/60 hover:border-amber-500 transition cursor-pointer flex items-center space-x-3";
        card.onclick = () => fetchETA(s, card, false);

        let stopNameHtml = '';
        if (s.kmbName && s.ctbName) {
          if (s.kmbName === s.ctbName) {
            stopNameHtml = `<div class="text-md font-medium text-stone-800">${s.kmbName}</div>`;
          } else {
            stopNameHtml = `
              <div class="flex flex-col text-sm font-medium space-y-1">
                <div class="flex items-center space-x-1.5 text-stone-800">
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-600 text-white flex-shrink-0">九巴</span>
                  <span>${s.kmbName}</span>
                </div>
                <div class="flex items-center space-x-1.5 text-stone-700">
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-400 text-amber-950 flex-shrink-0">城巴</span>
                  <span>${s.ctbName}</span>
                </div>
              </div>
            `;
          }
        } else if (s.kmbName) {
          stopNameHtml = `
            <div class="flex items-center space-x-1.5 text-md font-medium text-stone-800">
              ${currentSelectedRoute.companies.length > 1 ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-600 text-white flex-shrink-0">九巴</span>' : ''}
              <span>${s.kmbName}</span>
            </div>
          `;
        } else if (s.ctbName) {
          stopNameHtml = `
            <div class="flex items-center space-x-1.5 text-md font-medium text-stone-800">
              ${currentSelectedRoute.companies.length > 1 ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-400 text-amber-950 flex-shrink-0">城巴</span>' : ''}
              <span>${s.ctbName}</span>
            </div>
          `;
        } else {
          stopNameHtml = `<div class="text-md font-medium text-stone-800">${s.name}</div>`;
        }

        card.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs flex-shrink-0 border border-amber-200">
            ${s.displaySeq || s.seq}
          </div>
          ${stopNameHtml}
        `;
        container.appendChild(card);
      });
    }

    async function fetchETA(stop, activeCard, isAutoRefresh = false) {
      currentSelectedStop = stop;
      currentActiveCard = activeCard;

      document.querySelectorAll('#stopListView > div').forEach(el => {
        el.classList.remove('border-amber-600', 'bg-amber-50/80', 'shadow-md');
      });
      if (activeCard) {
        activeCard.classList.add('border-amber-600', 'bg-amber-50/80', 'shadow-md');
      }

      const seqNum = stop.displaySeq || stop.seq;
      let displayName = stop.name;
      if (stop.kmbName && stop.ctbName) {
        if (stop.kmbName === stop.ctbName) {
          displayName = stop.kmbName;
        } else {
          displayName = `九巴: ${stop.kmbName} | 城巴: ${stop.ctbName}`;
        }
      } else if (stop.kmbName) {
        displayName = stop.kmbName;
      } else if (stop.ctbName) {
        displayName = stop.ctbName;
      }

      document.getElementById('selectedStopInfo').textContent = `已選車站：${seqNum}. ${displayName}`;
      const etaContainer = document.getElementById('etaContainer');

      if (!isAutoRefresh) {
        etaContainer.innerHTML = `<span class="text-sm text-stone-500 animate-pulse flex items-center space-x-1"><span>🍄</span><span>查詢實時時間中...</span></span>`;
      }

      try {
        let fetchPromises = [];

        if (stop.kmbStopId) {
          const kmbVar = currentSelectedRoute.variants.find(v => v.company === 'KMB' || v.company === 'LWB') || { serviceType: '1' };
          fetchPromises.push(
            fetch(`${KMB_BASE}/eta/${stop.kmbStopId}/${currentSelectedRoute.route}/${kmbVar.serviceType}`)
              .then(r => r.json())
              .then(res => (res.data || []).map(item => ({ ...item, defaultCo: item.co || 'KMB' })))
              .catch(() => [])
          );
        }

        if (stop.ctbStopId) {
          fetchPromises.push(
            fetch(`${CTB_BASE}/eta/CTB/${stop.ctbStopId}/${currentSelectedRoute.route}`)
              .then(r => r.json())
              .then(res => (res.data || []).map(item => ({ ...item, defaultCo: 'CTB' })))
              .catch(() => [])
          );
        }

        if (stop.nlbStopId && stop.nlbRouteId) {
          fetchPromises.push(
            fetch(`${NLB_BASE}/stop.php?action=estimatedArrivals&routeId=${stop.nlbRouteId}&stopId=${stop.nlbStopId}`)
              .then(r => r.json())
              .then(res => (res.estimatedArrivals || []).map(item => ({
                eta: item.estimatedArrivalAt,
                co: 'NLB',
                defaultCo: 'NLB',
                rmk_tc: item.departed ? '已開出' : (item.noService ? '不提供服務' : '')
              })))
              .catch(() => [])
          );
        }

        const results = await Promise.all(fetchPromises);
        const rawEtas = results.flat();
        const now = new Date();

        const formattedEtas = rawEtas
          .filter(item => {
            if (!item || !item.eta) return false;

            if (item.dest_tc) {
              const destClean = cleanStopName(item.dest_tc);
              const origClean = cleanStopName(currentSelectedRoute.origTc);
              if (destClean && origClean && destClean === origClean && destClean !== cleanStopName(currentSelectedRoute.destTc)) {
                return false;
              }
            }
            return true;
          })
          .map(item => {
            const etaDate = new Date(item.eta);
            let diffMin = Math.round((etaDate - now) / 60000);
            
            if (diffMin < 0) {
              if (seqNum === 1 || diffMin >= -3) {
                diffMin = 0;
              } else {
                return null;
              }
            }

            const hh = String(etaDate.getHours()).padStart(2, '0');
            const mm = String(etaDate.getMinutes()).padStart(2, '0');
            const co = (item.co && item.co.trim()) ? item.co.trim().toUpperCase() : item.defaultCo;
            const rmk = item.rmk_tc || item.rmk_en || '';

            return {
              company: co,
              mins: diffMin,
              exactTime: `${hh}:${mm}`,
              rmk: rmk,
              rawTime: etaDate.getTime()
            };
          })
          .filter(item => item !== null);

        // Deduplicate identical ETAs
        const uniqueEtas = [];
        const seen = new Set();
        formattedEtas.forEach(item => {
          const key = `${item.company}-${item.exactTime}-${item.mins}`;
          if (!seen.has(key)) {
            seen.add(key);
            uniqueEtas.push(item);
          }
        });

        // Strictly sort ALL arrival items across all bus companies in chronological order
        uniqueEtas.sort((a, b) => a.rawTime - b.rawTime);

        // Always show the top 3 earliest ETAs
        const nextETAs = uniqueEtas.slice(0, 3);

        etaContainer.innerHTML = '';

        if (nextETAs.length === 0) {
          etaContainer.innerHTML = `<span class="text-sm text-rose-600 font-medium">暫無即時班次資料</span>`;
        } else {
          nextETAs.forEach((item, idx) => {
            const badge = document.createElement('div');
            badge.className = "bg-[#7a4831] text-amber-50 text-sm font-semibold px-3 py-1.5 rounded-xl shadow-sm flex items-center space-x-2 border border-[#633824]";
            
            let durationLabel = '';
            if (seqNum === 1) {
              durationLabel = item.mins === 0 ? '即將開出' : `${item.mins} 分鐘`;
            } else {
              durationLabel = item.mins === 0 ? '即將到站' : `${item.mins} 分鐘`;
            }

            let coBg = 'bg-amber-400 text-amber-950';
            let coName = '城巴';

            if (item.company === 'KMB') {
              coBg = 'bg-red-700 text-white';
              coName = '九巴';
            } else if (item.company === 'LWB') {
              coBg = 'bg-teal-700 text-white';
              coName = '龍運';
            } else if (item.company === 'NLB') {
              coBg = 'bg-cyan-700 text-white';
              coName = '嶼巴';
            }

            const companyBadgeHtml = `<span class="px-1.5 py-0.5 rounded text-xs font-bold ${coBg}">${coName}</span>`;
            const rmkTag = item.rmk ? `<span class="text-xs bg-amber-200/20 px-1.5 py-0.5 rounded text-amber-200 font-normal">${item.rmk}</span>` : '';

            badge.innerHTML = `
              <div class="flex items-center space-x-1.5">
                ${companyBadgeHtml}
                <span>第 ${idx + 1} 班: ${durationLabel} (${item.exactTime})</span>
                ${rmkTag}
              </div>
            `;
            etaContainer.appendChild(badge);
          });
        }

        if (!isAutoRefresh) {
          startAutoRefresh();
        }

      } catch (err) {
        if (!isAutoRefresh) {
          etaContainer.innerHTML = `<span class="text-sm text-rose-600">無法獲取實時數據</span>`;
        }
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (currentSelectedStop) {
          fetchETA(currentSelectedStop, currentActiveCard, true);
        }
      }, 5000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    function showRouteList() {
      stopAutoRefresh();
      document.getElementById('routeListView').classList.remove('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
      document.getElementById('stopListView').classList.add('hidden');
      document.getElementById('infoCard').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitle').innerHTML = `<span>🍄</span><span>Gugubus 菇專用香港巴士實時到站查詢</span>`;
    }

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (isLoading) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  </script>
