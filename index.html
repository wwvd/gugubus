    function t(key, vars = {}) {

      });

    function openMap(lat, long, e) {

    }

    function getHaversineDistanceKm(lat1, lon1, lat2, lon2) {
      if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function isLwbRoute(routeNum) {
      if (!routeNum) return false;
      const r = String(routeNum).trim().toUpperCase();
      if (/^(1\d\d|3\d\d|6\d\d|8\d\d|9\d\d|N1\d\d|N3\d\d|N6\d\d|N8\d\d|N9\d\d|X9\d\d)/.test(r)) return false;
      return /^(A\d|E\d|NA\d|S\d|R\d|N30|N31|N39|N42|N64|X33|X34|X36|X43|X47)/.test(r);
    }

    function isRacecourseDedicatedRoute(routeNum) {
      if (!routeNum) return false;
      const r = String(routeNum).trim().toUpperCase();
      return /^(848|868|869|872|872X|887|888|889|891|893|101R|102R|811)$/i.test(r);
    }

    function isCircularRoute(route) {
      if (!route) return false;
      const orig = cleanStopName(route.origTc);
      const dest = cleanStopName(route.destTc);
      if (orig && dest && orig === dest) return true;
      if (/循環線|circular/i.test(route.origTc || '') || /循環線|circular/i.test(route.destTc || '')) return true;
      return false;
    }

    function cleanStopName(name) {
      if (!name) return '';
      return String(name)
        .replace(/（.*?）|\(.*?\)|【.*?】/g, '')
        .replace(/巴士總站|巴士站|總站|分站|車站|特別班次|特別日|循環線|轉乘站|轉車站|市中心|廣場|大廈|商場|碼頭|邨|屋邨|公園|花園|鐵路站|港鐵站|收費廣場|過海隧道|對面|近|旁|Bus Terminus|Station/gi, '')
        .replace(/[，, \-_  \/\(\)]/g, '')
        .toLowerCase()
        .trim();
    }

    function getStopNameSimilarity(name1, name2) {
      if (!name1 || !name2) return 0;
      
      const n1 = String(name1).toLowerCase().trim();
      const n2 = String(name2).toLowerCase().trim();
      if (n1 === n2) return 1.0;

      const c1 = cleanStopName(n1);
      const c2 = cleanStopName(n2);
      if (!c1 || !c2) return 0;
      if (c1 === c2) return 1.0;

      if (c1.includes(c2) || c2.includes(c1)) {
        if (Math.min(c1.length, c2.length) >= 2) return 0.95;
      }

      const t1 = n1.replace(/[^\w\u4e00-\u9fa5]/g, ' ').split(/\s+/).filter(x => x.length > 0);
      const t2 = n2.replace(/[^\w\u4e00-\u9fa5]/g, ' ').split(/\s+/).filter(x => x.length > 0);

      if (t1.length > 0 && t2.length > 0) {
        let common = 0;
        t1.forEach(word => {
          if (t2.some(w2 => w2.includes(word) || word.includes(w2))) common++;
        });
        
        const ratio = common / Math.min(t1.length, t2.length);
        if (ratio >= 0.5) return 0.85;
      }

      return 0;
    }

    // STRICT CROSS-HARBOUR JOINT OPERATED ROUTE DETECTOR
    function isGenuineJointRoute(r1, r2) {
      if (!r1 || !r2 || !r1.route || !r2.route) return false;
      if (r1.route.toUpperCase() !== r2.route.toUpperCase()) return false;

      const normRoute = r1.route.trim().toUpperCase();
      
      // Only 3-digit cross-harbour / special joint series can group
      const isCrossHarbourPattern = /^(1\d\d|3\d\d|6\d\d|8\d\d|9\d\d|N1\d\d|N3\d\d|N6\d\d|N8\d\d|N9\d\d|X9\d\d|X1\d\d|R3\d\d|R6\d\d)$/i.test(normRoute);
      if (!isCrossHarbourPattern) return false;

      const orig1 = cleanStopName(r1.origTc);
      const dest1 = cleanStopName(r1.destTc);
      const orig2 = cleanStopName(r2.origTc);
      const dest2 = cleanStopName(r2.destTc);

      const directMatch = (orig1 && orig2 && (orig1.includes(orig2) || orig2.includes(orig1))) ||
                          (dest1 && dest2 && (dest1.includes(dest2) || dest2.includes(dest1)));

      const crossMatch = (orig1 && dest2 && (orig1.includes(dest2) || dest2.includes(orig1))) ||
                         (dest1 && orig2 && (dest1.includes(orig2) || dest2.includes(orig1)));

      return directMatch || crossMatch;
    }

    function canGroupWith(group, r) {
      if (!group || !r || !r.route) return false;
      if (group.route.toUpperCase() !== r.route.toUpperCase()) return false;

      // Group variants belonging to the same company
      if (group.companies.has(r.company)) return true;

      // Group cross-harbour joint routes between KMB and CTB
      return isGenuineJointRoute(group, r);
    }

    async function fetchWithRetry(url, options = {}, timeoutMs = 8000, retries = 2) {
      const fetchOpts = { ...options, cache: 'no-store' };
      for (let i = 0; i < retries; i++) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, { ...fetchOpts, signal: controller.signal });
          clearTimeout(timer);
          if (response.ok) {
            const json = await response.json();
            if (json) return json;
          }
        } catch (e) {
          clearTimeout(timer);
        }
        if (i < retries - 1) {
          await new Promise(res => setTimeout(res, 300));
        }
      }
      return null;
    }

    async function preloadRouteFares() {
      if (routeFareLoaded) return;
      
      const fetchPromises = FARE_DATA_URLS.map(url => fetchWithRetry(url, {}, 8000, 1));
      const results = await Promise.all(fetchPromises);
      for (const res of results) {
        if (res) {
          routeFareData = res.routeList || res.routes || res;
          routeFareLoaded = true;
          break;
        }
      }
    }

    async function preloadKmbStops() {
      if (kmbAllStopsLoaded) return;
      try {
        const res = await fetchWithRetry(`${KMB_BASE}/stop`, {}, 12000, 2);
        if (res && Array.isArray(res.data)) {
          res.data.forEach(s => {
            if (s.stop) {
              kmbStopMap.set(s.stop, {
                name_tc: s.name_tc || s.name_en || `巴士站 ${s.stop}`,
                name_en: s.name_en || s.name_tc || `Bus Stop ${s.stop}`,
                lat: parseFloat(s.lat) || null,
                long: parseFloat(s.long) || null
              });
            }
          });
          kmbAllStopsLoaded = true;
        }
      } catch (e) {
        console.warn("Bulk KMB stops preload fallback", e);
      }
    }

    async function preloadCtbStops() {
      if (ctbAllStopsLoaded) return;
      try {
        const res = await fetchWithRetry(`${CTB_BASE}/stop`, {}, 12000, 2);
        if (res && Array.isArray(res.data)) {
          res.data.forEach(s => {
            if (s.stop) {
              ctbStopMap.set(s.stop, {
                name_tc: s.name_tc || s.name_en || `巴士站 ${s.stop}`,
                name_en: s.name_en || s.name_tc || `Bus Stop ${s.stop}`,
                lat: parseFloat(s.lat) || null,
                long: parseFloat(s.long) || null
              });
            }
          });
          ctbAllStopsLoaded = true;
        }
      } catch (e) {
        console.warn("Bulk CTB stops preload fallback", e);
      }
    }

    async function getStopDetail(company, stopId) {
      if (!stopId) return { name_tc: "巴士站", name_en: "Bus Stop", lat: null, long: null };
      try {
        if (company === 'KMB' || company === 'LWB') {
          if (kmbStopMap.has(stopId)) return kmbStopMap.get(stopId);
          const res = await fetchWithRetry(`${KMB_BASE}/stop/${stopId}`, {}, 4000, 1);
          if (res && res.data) {
            const info = { 
              name_tc: res.data.name_tc || res.data.name_en || `巴士站 ${stopId}`, 
              name_en: res.data.name_en || res.data.name_tc || `Bus Stop ${stopId}`,
              lat: parseFloat(res.data.lat) || null, 
              long: parseFloat(res.data.long) || null 
            };
            kmbStopMap.set(stopId, info);
            return info;
          }
        } else if (company === 'CTB') {
          if (ctbStopMap.has(stopId)) return ctbStopMap.get(stopId);
          const res = await fetchWithRetry(`${CTB_BASE}/stop/${stopId}`, {}, 4000, 1);
          if (res && res.data) {
            const info = { 
              name_tc: res.data.name_tc || res.data.name_en || `巴士站 ${stopId}`, 
              name_en: res.data.name_en || res.data.name_tc || `Bus Stop ${stopId}`,
              lat: parseFloat(res.data.lat) || null, 
              long: parseFloat(res.data.long) || null 
            };
            ctbStopMap.set(stopId, info);
            return info;
          }
        }
      } catch (e) {
        console.warn("getStopDetail error", e);
      }
      return { name_tc: `巴士站 ${stopId}`, name_en: `Bus Stop ${stopId}`, lat: null, long: null };
    }

    // ACCURATE HK FRANCHISED BUS SECTION FARE MATRIX & ENGINE
    function calculateOfflineSectionFare(company, rKey, dirChar, seqIdx, totalStops) {
      const tot = Math.max(1, totalStops || 20);
      const ratio = seqIdx / Math.max(1, tot - 1); 

      let fullFare = 6.4; 

      // 1. Cross-Harbour Joint & Single Routes
      if (/^(1\d\d|3\d\d|6\d\d|8\d\d)/.test(rKey)) {
        fullFare = (company === 'KMB') ? 12.1 : 11.8;
      } else if (/^(9\d\d|N9\d\d)/.test(rKey)) {
        if (rKey === '930' || rKey === '930X') fullFare = (company === 'CTB') ? 18.2 : 18.0;
        else if (rKey === '960' || rKey === '968' || rKey === '978') fullFare = 24.7;
        else fullFare = 22.0;
      } else if (/^(N1\d\d|N3\d\d|N6\d\d)/.test(rKey)) {
        fullFare = 17.0;
      } 
      // 2. Airport & Lantau Express Routes
      else if (rKey.startsWith('A')) {
        fullFare = (rKey === 'A11' || rKey === 'A21' || rKey === 'A22' || rKey === 'A29') ? 41.9 : 33.0;
      } else if (rKey.startsWith('E')) {
        fullFare = 14.8;
      } else if (rKey.startsWith('S')) {
        fullFare = 3.7;
      } else if (rKey.startsWith('N') && !rKey.startsWith('NA')) {
        fullFare = 12.0;
      } else if (rKey.startsWith('NA')) {
        fullFare = 52.0;
      }
      // 3. Hong Kong Island Express & Urban Local Routes (Citybus)
      else if (rKey === '18X' || rKey === '18P') {
        fullFare = 10.1;
      } else if (rKey === '720' || rKey === '722' || rKey === '780' || rKey === '788' || rKey === '789') {
        fullFare = 8.7;
      } else if (rKey === '8X' || rKey === '8P' || rKey === '19P') {
        fullFare = 8.1;
      } else if (rKey === '2X') {
        fullFare = 7.7;
      } else if (rKey === '260' || rKey === '6' || rKey === '6X') {
        fullFare = 10.6;
      } else if (rKey === '1' && company === 'CTB') {
        fullFare = 4.8;
      } else if ((rKey === '5B' || rKey === '10' || rKey === '12' || rKey === '12A' || rKey === '12M') && company === 'CTB') {
        fullFare = 4.8;
      } else if ((rKey === '2' || rKey === '2A' || rKey === '8' || rKey === '11' || rKey === '23' || rKey === '25' || rKey === '26' || rKey === '27') && company === 'CTB') {
        fullFare = 5.2;
      }
      // 4. Kowloon & New Territories Long Distance Express Routes (KMB / LWB)
      else if (rKey === '1' && company === 'KMB') {
        fullFare = 6.4;
      } else if (rKey === '1A' && company === 'KMB') {
        fullFare = 7.9;
      } else if (/^(58|59|60|63|66|67|68|69|258|259|260|268|269|270|276|277|278|279|290)[A-Z]?$/.test(rKey)) {
        fullFare = 15.6;
      } else if (/^(74|75|87|88|89|98|215|219|296)[A-Z]?$/.test(rKey)) {
        fullFare = 11.1;
      } else if (/^\d{1,3}[A-Z]?$/.test(rKey)) {
        const num = parseInt(rKey, 10);
        if (num <= 10) fullFare = 5.4;
        else if (num <= 30) fullFare = 6.4;
        else if (num <= 99) fullFare = 7.5;
        else fullFare = 9.8;
      }

      // Dynamic Section Fare Step-Down Logic
      if (fullFare >= 15.0) {
        if (ratio > 0.80) return Math.max(4.8, Math.round(fullFare * 0.30 * 10) / 10);
        if (ratio > 0.55) return Math.max(5.2, Math.round(fullFare * 0.50 * 10) / 10);
        if (ratio > 0.35) return Math.max(7.2, Math.round(fullFare * 0.70 * 10) / 10);
        return fullFare;
      } else if (fullFare >= 8.0) {
        if (ratio > 0.75) return Math.max(4.8, Math.round(fullFare * 0.45 * 10) / 10);
        if (ratio > 0.45) return Math.max(5.2, Math.round(fullFare * 0.68 * 10) / 10);
        return fullFare;
      } else if (fullFare >= 6.0) {
        if (ratio > 0.80) return Math.max(4.8, Math.round(fullFare * 0.70 * 10) / 10);
        return fullFare;
      }

      return fullFare;
    }

    // OPERATOR-SPECIFIC FARE RESOLVER (NEVER RETURNS NULL)
    function getCompanySpecificFare(company, routeNum, dir, stopId, seq, displaySeq, totalStops) {
      if (!routeNum) return 6.4;
      
      const rKey = String(routeNum).trim().toUpperCase();
      const dirChar = (dir === 'outbound' || dir === 'O') ? 'O' : 'I';
      const seqIdx = (displaySeq != null && displaySeq >= 1) ? displaySeq - 1 : (seq ? seq - 1 : 0);
      const coPrefix = company ? company.toUpperCase() : '';

      if (routeFareData) {
        const primaryKeys = coPrefix ? [
          `${coPrefix}-${rKey}-${dirChar}`,
          `${coPrefix}_${rKey}_${dirChar}`,
          `${coPrefix}:${rKey}:${dirChar}`,
          `${coPrefix}-${rKey}`
        ] : [];

        const fallbackKeys = [
          `${rKey}-${dirChar}`, `${rKey}_${dirChar}`, `${rKey}:${dirChar}`, `${rKey}`
        ];

        const keysToSearch = [...primaryKeys, ...fallbackKeys];

        for (const cKey of keysToSearch) {
          if (routeFareData[cKey] != null) {
            const rawItem = routeFareData[cKey];

            if (Array.isArray(rawItem) && rawItem.length > 0) {
              const targetIdx = Math.min(seqIdx, rawItem.length - 1);
              const val = rawItem[targetIdx];

              if (typeof val === 'number' && val > 0) return val;
              if (typeof val === 'string') {
                const parsed = parseFloat(val);
                if (!isNaN(parsed) && parsed > 0) return parsed;
              }

              for (const sItem of rawItem) {
                if (typeof sItem === 'object' && sItem !== null) {
                  const matchId = stopId && (sItem.stop === stopId || sItem.stopId === stopId);
                  const matchSeq = (seq != null && sItem.seq === seq) || (sItem.seq === displaySeq);
                  if (matchId || matchSeq) {
                    const f = parseFloat(sItem.fare || sItem.adultFare || sItem.price);
                    if (!isNaN(f) && f > 0) return f;
                  }
                }
              }
            } 
            else if (typeof rawItem === 'object' && rawItem !== null) {
              const dirArr = rawItem[dirChar] || rawItem[dir === 'outbound' ? 'outbound' : 'inbound'];
              if (dirArr && Array.isArray(dirArr)) {
                const targetIdx = Math.min(seqIdx, dirArr.length - 1);
                const val = dirArr[targetIdx];
                if (typeof val === 'number' && val > 0) return val;
                if (typeof val === 'string') {
                  const p = parseFloat(val);
                  if (!isNaN(p) && p > 0) return p;
                }
              }
              const stopArray = rawItem.stops || rawItem.fareList || rawItem.fares || null;
              if (Array.isArray(stopArray)) {
                for (const sItem of stopArray) {
                  if (typeof sItem === 'object' && sItem !== null) {
                    const matchId = stopId && (sItem.stop === stopId || sItem.stopId === stopId);
                    const matchSeq = (seq != null && sItem.seq === seq) || (sItem.seq === displaySeq);
                    if (matchId || matchSeq) {
                      const f = parseFloat(sItem.fare || sItem.adultFare || sItem.price);
                      if (!isNaN(f) && f > 0) return f;
                    }
                  }
                }
              } else if (typeof rawItem.fare === 'number' && rawItem.fare > 0) {
                return rawItem.fare;
              }
            } else if (typeof rawItem === 'number' && rawItem > 0) {
              return rawItem;
            }
          }
        }
      }

      return calculateOfflineSectionFare(coPrefix, rKey, dirChar, seqIdx, totalStops);
    }

    // GENERIC TIME-OF-DAY & SPECIAL DEPARTURE CLASSIFIER (ALL ROUTES)
    function checkIsSpecialDayOrTimeStop(stop, primaryCompany, serviceType, routeNum) {
      const tcName = String(stop.name_tc || '');
      const enName = String(stop.name_en || '');
      const combined = (tcName + ' ' + enName).toLowerCase();
      const rNum = String(routeNum || '').trim().toUpperCase();

      const isSunPhDiversion = combined.includes('歷山大廈') || combined.includes('alexandra house') ||
                               combined.includes('遮打花園') || combined.includes('chater garden');

      if (isSunPhDiversion) {
        return {
          isSpecial: true,
          badgeTextKey: 'sunAndPhOnly',
          badgeClass: 'bg-purple-100 text-purple-900 border-purple-300',
          descriptionTc: '只限星期日及公眾假期特定時段途經（遮打道行人專用區生效時之改道車站）',
          descriptionEn: 'Served on Sundays & Public Holidays only (Chater Road Pedestrian Zone diversion)'
        };
      }

      const isMonSatOnly = combined.includes('遮打道') || combined.includes('chater road') ||
                           (combined.includes('皇后像廣場') && (combined.includes('遮打') || combined.includes('chater')));

      if (isMonSatOnly) {
        return {
          isSpecial: true,
          badgeTextKey: 'monToSatOnly',
          badgeClass: 'bg-blue-100 text-blue-900 border-blue-300',
          descriptionTc: '只限星期一至六特定時段途經（逢星期日及公眾假期改經遮打花園/歷山大廈）',
          descriptionEn: 'Served Mon–Sat only (Diverted via Chater Garden/Alexandra House on Sun & Public Holidays)'
        };
      }

      if (isRacecourseDedicatedRoute(rNum) || combined.includes('馬場') || combined.includes('racecourse')) {
        return {
          isSpecial: true,
          badgeTextKey: 'racecourseBadge',
          badgeClass: 'bg-amber-100 text-amber-900 border-amber-300',
          descriptionTc: '只限沙田/跑馬地賽馬日特定時段服務',
          descriptionEn: 'Operates on Sha Tin / Happy Valley Race Days only'
        };
      }

      const st = String(stop.specialServiceType || serviceType || '1');
      if (st === '2') {
        return {
          isSpecial: true,
          badgeTextKey: 'morningPeakBadge',
          badgeClass: 'bg-amber-100 text-amber-900 border-amber-300',
          descriptionTc: '星期一至五晨早特別班次時段途經車站',
          descriptionEn: 'Morning Peak Special Departure stop (Mon–Fri morning hours)'
        };
      } else if (st === '3' || st === '4' || st === '5') {
        return {
          isSpecial: true,
          badgeTextKey: 'eveningPeakBadge',
          badgeClass: 'bg-orange-100 text-orange-900 border-orange-300',
          descriptionTc: '星期一至五傍晚繁忙時間特別班次途經車站',
          descriptionEn: 'Evening Peak Special Departure stop (Mon–Fri evening hours)'
        };
      } else if (st !== '1' || stop.isSpecialDayStop) {
        return {
          isSpecial: true,
          badgeTextKey: 'specialTimeBadge',
          badgeClass: 'bg-amber-100 text-amber-900 border-amber-300',
          descriptionTc: '特定時段 / 特別班次限定車站',
          descriptionEn: 'Served during specific operating hours or special departures only'
        };
      }

      if (combined.includes('特別班次') || combined.includes('時段') || combined.includes('學校') || combined.includes('繁忙時間') || combined.includes('晨早') || combined.includes('特別日')) {
        return {
          isSpecial: true,
          badgeTextKey: 'peakOnlyBadge',
          badgeClass: 'bg-rose-100 text-rose-900 border-rose-300',
          descriptionTc: '特定繁忙時間/學校日限定車站',
          descriptionEn: 'Served during peak hours or school days only'
        };
      }

      return { isSpecial: false };
    }

    async function fetchAllRoutes() {
      showLoading(true);
      document.getElementById('retryBtn').classList.add('hidden');
      document.getElementById('loadingText').textContent = t('loadingText');

      try {
        const [kmbRes, ctbRes] = await Promise.all([
          fetchWithRetry(`${KMB_BASE}/route`, {}, 12000, 3),
          fetchWithRetry(`${CTB_BASE}/route/CTB`, {}, 10000, 3),
          preloadKmbStops(),
          preloadCtbStops(),
          preloadRouteFares()
        ]);

        if (!kmbRes && !ctbRes) {
          document.getElementById('loadingText').textContent = t('loadError');
          document.getElementById('retryBtn').classList.remove('hidden');
          return;
        }

        const kmbRoutes = ((kmbRes && kmbRes.data) || []).map(r => {
          const lwbCheck = isLwbRoute(r.route);
          return {
            company: lwbCheck ? 'LWB' : 'KMB',
            route: r.route ? String(r.route).trim() : '',
            bound: r.bound,
            serviceType: String(r.service_type || '1'),
            origTc: r.orig_tc,
            origEn: r.orig_en || r.orig_tc,
            destTc: r.dest_tc,
            destEn: r.dest_en || r.dest_tc
          };
        });

        const ctbRoutes = ((ctbRes && ctbRes.data) || []).map(r => ({
          company: 'CTB',
          route: r.route ? String(r.route).trim() : '',
          bound: r.bound || 'outbound',
          serviceType: '1',
          origTc: r.orig_tc,
          origEn: r.orig_en || r.orig_tc,
          destTc: r.dest_tc,
          destEn: r.dest_en || r.dest_tc
        }));

        const combined = [...kmbRoutes, ...ctbRoutes];
        const routeGroups = [];

        combined.forEach(r => {
          if (!r.route) return;
          let matchedGroup = routeGroups.find(g => canGroupWith(g, r));
          if (!matchedGroup) {
            matchedGroup = {
              route: r.route,
              companies: new Set(),
              variants: [],
              origTc: r.origTc || r.route,
              origEn: r.origEn || r.route,
              destTc: r.destTc || r.route,
              destEn: r.destEn || r.route
            };
            routeGroups.push(matchedGroup);
          }
          matchedGroup.companies.add(r.company);
          const isDuplicateVariant = matchedGroup.variants.some(v => 
            v.company === r.company && v.bound === r.bound && v.serviceType === r.serviceType
          );
          if (!isDuplicateVariant) matchedGroup.variants.push(r);
        });

        allRoutes = routeGroups.map(g => ({
          route: g.route,
          companies: Array.from(g.companies),
          variants: g.variants,
          origTc: g.origTc,
          origEn: g.origEn,
          destTc: g.destTc,
          destEn: g.destEn
        }));

        allRoutes.sort((a, b) => a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' }));
        renderRoutes(allRoutes);
      } catch (err) {
        console.error("Error loading routes:", err);
        document.getElementById('loadingText').textContent = t('errorOccurred');
        document.getElementById('retryBtn').classList.remove('hidden');
      } finally {
        showLoading(false);
      }
    }

    function matchJointStops(kmbStops, ctbStops) {
      if (!kmbStops || !kmbStops.length) {
        if (ctbStops && ctbStops.length) {
          return ctbStops.map(s => ({
            seq: s.seq,
            kmbSeq: null,
            ctbSeq: s.seq,
            name_tc: s.name_tc,
            name_en: s.name_en,
            ctbStopId: s.stopId,
            lat: s.lat,
            long: s.long,
            isSpecialDayStop: s.isSpecialDayStop || false,
            specialServiceType: s.specialServiceType || null,
            specialCompany: s.specialCompany || 'CTB'
          }));
        }
        return [];
      }
      if (!ctbStops || !ctbStops.length) {
        return kmbStops.map(s => ({ 
          seq: s.seq, 
          kmbSeq: s.seq,
          ctbSeq: null,
          name_tc: s.name_tc, 
          name_en: s.name_en, 
          kmbStopId: s.stopId, 
          lat: s.lat, 
          long: s.long,
          isSpecialDayStop: s.isSpecialDayStop || false,
          specialServiceType: s.specialServiceType || null,
          specialCompany: s.specialCompany || 'KMB'
        }));
      }

      const usedCtbIndices = new Set();
      return kmbStops.map((kStop, kIdx) => {
        let bestCtbIdx = -1;
        let bestScore = -1;

        ctbStops.forEach((cStop, cIdx) => {
          if (usedCtbIndices.has(cIdx)) return;

          let score = 0;
          const simTc = getStopNameSimilarity(kStop.name_tc, cStop.name_tc);
          const simEn = getStopNameSimilarity(kStop.name_en, cStop.name_en);
          const nameSim = Math.max(simTc, simEn);

          const dist = getHaversineDistanceKm(kStop.lat, kStop.long, cStop.lat, cStop.long);

          if (dist != null) {
            if (dist < 0.15) score += 0.60;
            else if (dist < 0.35) score += 0.35;
            else if (dist < 0.60) score += 0.15;
          }

          score += nameSim * 0.5;

          if (ctbStops.length > 1 && kmbStops.length > 1) {
            const kRatio = kIdx / (kmbStops.length - 1);
            const cRatio = cIdx / (ctbStops.length - 1);
            if (Math.abs(kRatio - cRatio) < 0.20) score += 0.20;
          }

          if (score > bestScore && (score >= 0.25 || (dist != null && dist < 0.40))) {
            bestScore = score;
            bestCtbIdx = cIdx;
          }
        });

        let ctbId = null;
        let ctbNameEn = null;
        let ctbLat = null;
        let ctbLong = null;
        let ctbSeq = null;

        if (bestCtbIdx !== -1) {
          usedCtbIndices.add(bestCtbIdx);
          const matchedCStop = ctbStops[bestCtbIdx];
          ctbId = matchedCStop.stopId;
          ctbNameEn = matchedCStop.name_en;
          ctbLat = matchedCStop.lat;
          ctbLong = matchedCStop.long;
          ctbSeq = matchedCStop.seq;
        }

        return {
          seq: kStop.seq,
          kmbSeq: kStop.seq,
          ctbSeq: ctbSeq,
          name_tc: kStop.name_tc,
          name_en: kStop.name_en || ctbNameEn,
          kmbStopId: kStop.stopId,
          ctbStopId: ctbId,
          lat: kStop.lat || ctbLat,
          long: kStop.long || ctbLong,
          isSpecialDayStop: kStop.isSpecialDayStop || false,
          specialServiceType: kStop.specialServiceType || null,
          specialCompany: kStop.specialCompany || 'KMB'
        };
      });
    }

    function isValidRealtimeEta(item, expectedKmbBound, expectedCtbBound, origTc, destTc, now = new Date(), targetStop = null) {
      if (!item) return false;

      const hasEtaString = item.eta && String(item.eta).trim() !== '';
      const hasEtaSeconds = typeof item.arrivalTimeInSecond === 'number' && !isNaN(item.arrivalTimeInSecond);
      if (!hasEtaString && !hasEtaSeconds) return false;

      const etaDate = parseEtaToDate(item, now);
      if (!etaDate) return false;

      const diffMs = etaDate.getTime() - now.getTime();
      if (diffMs < -60000) return false;

      const apiSource = item.apiSource;
      const isCircular = isCircularRoute(currentSelectedRoute);

      if (isCircular && targetStop && typeof item.seq !== 'undefined' && item.seq !== null) {
        const itemSeq = parseInt(item.seq, 10);
        if (apiSource === 'CTB_API') {
          if (targetStop.ctbSeq != null && itemSeq !== parseInt(targetStop.ctbSeq, 10)) {
            return false;
          }
        } else {
          if (targetStop.kmbSeq != null && itemSeq !== parseInt(targetStop.kmbSeq, 10)) {
            return false;
          }
        }
      }

      const cleanOrig = cleanStopName(origTc);
      const cleanDest = cleanStopName(destTc);
      const rawItemDest = (item.dest_tc || item.dest_en || '').trim();
      const cleanItemDest = cleanStopName(rawItemDest);

      if (cleanItemDest && cleanOrig && cleanDest && cleanOrig !== cleanDest) {
        const simToOrig = getStopNameSimilarity(cleanItemDest, cleanOrig);
        const simToDest = getStopNameSimilarity(cleanItemDest, cleanDest);

        if (simToOrig > simToDest && simToOrig >= 0.35 && simToDest < 0.30) {
          return false;
        }
      }

      const rmk = ((item.rmk_tc || '') + ' ' + (item.rmk_en || '') + ' ' + (item.rmk || '')).toLowerCase();
      const hardOffKeywords = ['尾班車已過', '末班車已過', '最後班次已過', '服務已結束', '非服務時間', '暫停服務', 'last bus passed', 'end of service', 'out of service'];
      for (const kw of hardOffKeywords) {
        if (rmk.includes(kw)) return false;
      }

      return true;
    }

    async function loadStopsForCurrentRoute() {
      showLoading(true);
      const stopListEl = document.getElementById('stopListView');
      stopListEl.classList.add('hidden');
      stopListEl.innerHTML = '';

      try {
        const route = currentSelectedRoute;
        let kmbStopsDetailed = [];
        let ctbStopsDetailed = [];

        // 1. POPULATE KMB / LWB STOPS
        if (route.companies.includes('KMB') || route.companies.includes('LWB')) {
          const targetDir = route.dir; 
          const kmbBoundParam = (targetDir === 'inbound') ? 'inbound' : 'outbound';
          
          let resMain = await fetchWithRetry(`${KMB_BASE}/route-stop/${route.route}/${kmbBoundParam}/1`, {}, 7000, 2);
          let rawMainStops = (resMain && resMain.data) || [];

          if (rawMainStops.length === 0) {
            const altDir = (kmbBoundParam === 'outbound') ? 'inbound' : 'outbound';
            const resAlt = await fetchWithRetry(`${KMB_BASE}/route-stop/${route.route}/${altDir}/1`, {}, 5000, 2);
            if (resAlt && resAlt.data && resAlt.data.length > 0) {
              rawMainStops = resAlt.data;
            }
          }

          rawMainStops.sort((a, b) => a.seq - b.seq);

          kmbStopsDetailed = await Promise.all(rawMainStops.map(async (s) => {
            const info = await getStopDetail(route.companies.includes('LWB') ? 'LWB' : 'KMB', s.stop);
            return { 
              stopId: s.stop, 
              seq: s.seq, 
              name_tc: info.name_tc, 
              name_en: info.name_en, 
              lat: info.lat, 
              long: info.long, 
              isSpecialDayStop: false,
              specialServiceType: '1'
            };
          }));

          const specialVariants = route.variants.filter(v => (v.company === 'KMB' || v.company === 'LWB') && String(v.serviceType) !== '1');
          for (const spVar of specialVariants) {
            const resSp = await fetchWithRetry(`${KMB_BASE}/route-stop/${route.route}/${kmbBoundParam}/${spVar.serviceType}`, {}, 5000, 2);
            const rawSpStops = (resSp && resSp.data) || [];
            for (const spS of rawSpStops) {
              const existingIndex = kmbStopsDetailed.findIndex(existing => existing.stopId === spS.stop);
              if (existingIndex === -1) {
                const info = await getStopDetail(route.companies.includes('LWB') ? 'LWB' : 'KMB', spS.stop);
                kmbStopsDetailed.push({
                  stopId: spS.stop,
                  seq: spS.seq,
                  name_tc: info.name_tc,
                  name_en: info.name_en,
                  lat: info.lat,
                  long: info.long,
                  isSpecialDayStop: true,
                  specialServiceType: spVar.serviceType,
                  specialCompany: spVar.company
                });
              } else {
                kmbStopsDetailed[existingIndex].hasSpecialVariant = true;
              }
            }
          }
          kmbStopsDetailed.sort((a, b) => a.seq - b.seq);
        }

        // 2. POPULATE CITYBUS STOPS
        if (route.companies.includes('CTB')) {
          const targetDir = route.dir;
          const ctbBoundParam = (targetDir === 'inbound') ? 'inbound' : 'outbound';

          let resCtb = await fetchWithRetry(`${CTB_BASE}/route-stop/CTB/${route.route}/${ctbBoundParam}`, {}, 7000, 2);
          let rawCtbStops = (resCtb && resCtb.data) || [];

          if (rawCtbStops.length === 0) {
            const altDir = (ctbBoundParam === 'outbound') ? 'inbound' : 'outbound';
            const resAlt = await fetchWithRetry(`${CTB_BASE}/route-stop/CTB/${route.route}/${altDir}`, {}, 5000, 2);
            if (resAlt && resAlt.data && resAlt.data.length > 0) {
              rawCtbStops = resAlt.data;
            }
          }

          rawCtbStops.sort((a, b) => a.seq - b.seq);

          ctbStopsDetailed = await Promise.all(rawCtbStops.map(async (s) => {
            const info = await getStopDetail('CTB', s.stop);
            return { 
              stopId: s.stop, 
              seq: s.seq, 
              name_tc: info.name_tc, 
              name_en: info.name_en, 
              lat: info.lat, 
              long: info.long, 
              specialCompany: 'CTB'
            };
          }));
        }

        currentSelectedRoute.kmbStopsDetailed = kmbStopsDetailed;
        currentSelectedRoute.ctbStopsDetailed = ctbStopsDetailed;

        let finalStops = [];
        if (kmbStopsDetailed.length > 0 && ctbStopsDetailed.length > 0) {
          finalStops = matchJointStops(kmbStopsDetailed, ctbStopsDetailed);
        } else if (kmbStopsDetailed.length > 0) {
          finalStops = kmbStopsDetailed.map(s => ({ 
            seq: s.seq, 
            kmbSeq: s.seq, 
            ctbSeq: null, 
            name_tc: s.name_tc, 
            name_en: s.name_en, 
            kmbStopId: s.stopId, 
            lat: s.lat, 
            long: s.long, 
            isSpecialDayStop: s.isSpecialDayStop || false,
            specialServiceType: s.specialServiceType || null,
            specialCompany: s.specialCompany || 'KMB'
          }));
        } else if (ctbStopsDetailed.length > 0) {
          finalStops = ctbStopsDetailed.map(s => ({ 
            seq: s.seq, 
            kmbSeq: null, 
            ctbSeq: s.seq, 
            name_tc: s.name_tc, 
            name_en: s.name_en, 
            ctbStopId: s.stopId, 
            lat: s.lat, 
            long: s.long, 
            specialCompany: 'CTB'
          }));
        }

        const totalStopsCount = finalStops.length;
        finalStops.forEach((s, idx) => { 
          s.displaySeq = idx + 1; 
        });

        currentRenderedStops = finalStops;
        renderStops(finalStops);
      } catch (err) {
        console.error("Error loading stops:", err);
      } finally {
        showLoading(false);
      }
    }

    function handleStopClick(stop) {
      const clickedSeq = stop.displaySeq || stop.seq;

      if (!currentOriginStop) {
        currentOriginStop = stop;
        currentDestStop = null;
      } else if (currentOriginStop && !currentDestStop) {
        const origSeq = currentOriginStop.displaySeq || currentOriginStop.seq;
        if (clickedSeq > origSeq) {
          currentDestStop = stop;
        } else {
          currentOriginStop = stop;
          currentDestStop = null;
        }
      } else {
        currentOriginStop = stop;
        currentDestStop = null;
      }

      updateInfoCardUI();
      renderStops(currentRenderedStops);
      fetchETAAndTravelTime(false);

    function parseEtaToDate(item, now) {
      if (typeof item.arrivalTimeInSecond === 'number' && !isNaN(item.arrivalTimeInSecond)) {
        return new Date(now.getTime() + item.arrivalTimeInSecond * 1000);
      }
      if (!item.eta) return null;
      let str = String(item.eta).trim();
      if (!str) return null;

      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    async function fetchStopRawEtas(stop) {
      let fetchPromises = [];
      const routeIsLwb = isLwbRoute(currentSelectedRoute.route) || (currentSelectedRoute.companies.includes('LWB') && !currentSelectedRoute.companies.includes('KMB'));
      const isJoint = currentSelectedRoute.companies.length > 1;

      let kmbId = stop.kmbStopId;
      let ctbId = stop.ctbStopId;

      if (isJoint && !ctbId && currentSelectedRoute.ctbStopsDetailed && currentSelectedRoute.ctbStopsDetailed.length > 0) {
        let bestRouteScore = -1;
        let bestRouteCtb = null;

        currentSelectedRoute.ctbStopsDetailed.forEach(cS => {
          const simTc = getStopNameSimilarity(stop.name_tc, cS.name_tc);
          const simEn = getStopNameSimilarity(stop.name_en, cS.name_en);
          let score = Math.max(simTc, simEn);

          if (stop.lat != null && stop.long != null && cS.lat != null && cS.long != null) {
            const dist = getHaversineDistanceKm(stop.lat, stop.long, cS.lat, cS.long);
            if (dist < 0.2) score += 0.4;
            else if (dist < 0.4) score += 0.2;
          }

          if (score > bestRouteScore) {
            bestRouteScore = score;
            bestRouteCtb = cS;
          }
        });

        if (bestRouteCtb && bestRouteScore >= 0.25) {
          ctbId = bestRouteCtb.stopId;
          stop.ctbStopId = ctbId;
          stop.ctbSeq = bestRouteCtb.seq;
        }
      }

      if (kmbId) {
        const defaultTag = routeIsLwb ? 'LWB' : 'KMB';
        const serviceTypeToFetch = stop.specialServiceType || '1';
        fetchPromises.push(
          fetchWithRetry(`${KMB_BASE}/eta/${kmbId}/${currentSelectedRoute.route}/${serviceTypeToFetch}`, {}, 4000, 2)
            .then(res => ((res && res.data) || []).map(item => ({
              ...item,
              apiSource: 'KMB_API',
              defaultCo: routeIsLwb ? 'LWB' : (item.co && item.co.trim() ? item.co.trim().toUpperCase() : defaultTag)
            })))
        );
      }

      if (ctbId) {
        fetchPromises.push(
          fetchWithRetry(`${CTB_BASE}/eta/CTB/${ctbId}/${currentSelectedRoute.route}`, {}, 4000, 2)
            .then(res => ((res && res.data) || []).map(item => ({
              ...item,
              apiSource: 'CTB_API',
              defaultCo: 'CTB'
            })))
        );
      }

      const results = await Promise.all(fetchPromises);
      return results.flat();
    }

    async function fetchETAAndTravelTime(isAutoRefresh = false) {
      if (!currentOriginStop) return;
      if (isAutoRefresh && isFetchingEtaInFlight) return;

      isFetchingEtaInFlight = true;
      const etaContainer = document.getElementById('etaContainer');
      const travelTimeText = document.getElementById('travelTimeText');

      if (!isAutoRefresh) {
        etaContainer.innerHTML = `<span class="text-sm text-stone-500 animate-pulse flex items-center space-x-1"><span>🍄</span><span>${t('fetchingEta')}</span></span>`;
        if (currentDestStop) {
          travelTimeText.textContent = t('calculatingTime');
        }
      }

      try {
        const now = new Date();
        const expectedKmbBound = currentSelectedRoute.dir;
        const expectedCtbBound = currentSelectedRoute.ctbMatchedDir || currentSelectedRoute.dir;
        const origTc = currentSelectedRoute.origTc;
        const destTc = currentSelectedRoute.destTc;
        const routeIsLwb = isLwbRoute(currentSelectedRoute.route) || (currentSelectedRoute.companies.includes('LWB') && !currentSelectedRoute.companies.includes('KMB'));

        const rawOrigEtas = await fetchStopRawEtas(currentOriginStop);
        const formattedOrigEtas = rawOrigEtas
          .filter(item => isValidRealtimeEta(item, expectedKmbBound, expectedCtbBound, origTc, destTc, now, currentOriginStop))
          .map(item => {
            const etaDate = parseEtaToDate(item, now);
            let diffMin = Math.round((etaDate - now) / 60000);
            if (diffMin < 0) diffMin = 0;

            const hh = String(etaDate.getHours()).padStart(2, '0');
            const mm = String(etaDate.getMinutes()).padStart(2, '0');
            
            let co = (item.co && item.co.trim()) ? item.co.trim().toUpperCase() : item.defaultCo;
            if (routeIsLwb && co !== 'CTB') co = 'LWB';

            const rmkStr = (currentLang === 'en') ? (item.rmk_en || item.rmk_tc || '') : (item.rmk_tc || item.rmk_en || '');

            return {
              company: co,
              mins: diffMin,
              exactTime: `${hh}:${mm}`,
              rmk: rmkStr,
              rawTime: etaDate.getTime()
            };
          });

        const uniqueOrigEtas = [];
        formattedOrigEtas.forEach(item => {
          const exists = uniqueOrigEtas.some(u => u.company === item.company && Math.abs(u.rawTime - item.rawTime) < 90000);
          if (!exists) {
            uniqueOrigEtas.push(item);
          }
        });

        uniqueOrigEtas.sort((a, b) => a.rawTime - b.rawTime);

        const nextETAs = uniqueOrigEtas.slice(0, 3);
        etaContainer.innerHTML = '';

        if (nextETAs.length === 0) {
          etaContainer.innerHTML = `<span class="text-sm text-rose-600 font-medium">${t('noEta')}</span>`;
        } else {
          const origSeq = currentOriginStop.displaySeq || currentOriginStop.seq;
          nextETAs.forEach((item, idx) => {
            const badge = document.createElement('div');
            badge.className = "bg-[#7a4831] text-amber-50 text-sm font-semibold px-3 py-1.5 rounded-xl shadow-sm flex items-center space-x-2 border border-[#633824]";
            
            let durationLabel = item.mins === 0 ? (origSeq === 1 ? t('departing') : t('arriving')) : `${item.mins} ${t('mins')}`;
            let coBg = 'bg-amber-400 text-amber-950';
            let coName = t('ctb');

            if (item.company === 'KMB') { 
              coBg = 'bg-red-700 text-white'; 
              coName = t('kmb'); 
            } else if (item.company === 'LWB') { 
              coBg = 'bg-teal-700 text-white'; 
              coName = t('lwb'); 
            }

            const companyBadgeHtml = `<span class="px-1.5 py-0.5 rounded text-xs font-bold ${coBg}">${coName}</span>`;
            const rmkTag = item.rmk ? `<span class="text-xs bg-amber-200/20 px-1.5 py-0.5 rounded text-amber-200 font-normal">${item.rmk}</span>` : '';
            const tripLabel = t('busTrip', { n: idx + 1 });

            badge.innerHTML = `
              <div class="flex items-center space-x-1.5">
                ${companyBadgeHtml}
                <span>${tripLabel}: ${durationLabel} (${item.exactTime})</span>
                ${rmkTag}
              </div>
            `;
            etaContainer.appendChild(badge);
          });
        }

        if (currentDestStop) {
          const origIdx = currentRenderedStops.findIndex(s => (s.displaySeq || s.seq) === (currentOriginStop.displaySeq || currentOriginStop.seq));
          const destIdx = currentRenderedStops.findIndex(s => (s.displaySeq || s.seq) === (currentDestStop.displaySeq || currentDestStop.seq));

          if (origIdx !== -1 && destIdx !== -1 && destIdx > origIdx) {
            const stopCount = destIdx - origIdx;
            let liveDeltaMins = null;

            try {
              const rawDestEtas = await fetchStopRawEtas(currentDestStop);
              const validDestEtas = rawDestEtas
                .filter(item => isValidRealtimeEta(item, expectedKmbBound, expectedCtbBound, origTc, destTc, now, currentDestStop))
                .map(item => parseEtaToDate(item, now)?.getTime() || 0)
                .filter(t => t > 0)
                .sort((a, b) => a - b);

              if (uniqueOrigEtas.length > 0 && validDestEtas.length > 0) {
                const minAllowedMs = Math.max(120000, stopCount * 120000);
                const maxAllowedMs = stopCount * 420000;

                for (const oEta of uniqueOrigEtas) {
                  const oTime = oEta.rawTime;
                  const matchingDestTime = validDestEtas.find(dTime => {
                    const diff = dTime - oTime;
                    return diff >= minAllowedMs && diff <= maxAllowedMs;
                  });

                  if (matchingDestTime) {
                    const candidateLiveMins = Math.round((matchingDestTime - oTime) / 60000);
                    if (candidateLiveMins >= Math.ceil(stopCount * 2.0)) {
                      liveDeltaMins = candidateLiveMins;
                      break;
                    }
                  }
                }
              }
            } catch (e) {
              console.warn("Live ETA delta fallback", e);
            }

            if (liveDeltaMins && liveDeltaMins >= Math.ceil(stopCount * 2.0)) {
              travelTimeText.textContent = t('travelTimeEstimate', { mins: liveDeltaMins, stops: stopCount });
            } else {
              let totalSegMins = 0;

              for (let i = origIdx; i < destIdx; i++) {
                const s1 = currentRenderedStops[i];
                const s2 = currentRenderedStops[i+1];
                const rawDist = getHaversineDistanceKm(s1?.lat, s1?.long, s2?.lat, s2?.long);
                
                const roadDist = rawDist ? (rawDist * 1.45) : null;

                if (roadDist && roadDist > 0.05) {
                  if (roadDist > 3.0) {
                    totalSegMins += (roadDist / 40.0) * 60;
                  } else if (roadDist > 1.5) {
                    totalSegMins += (roadDist / 24.0) * 60;
                  } else {
                    totalSegMins += (roadDist / 12.0) * 60;
                  }
                } else {
                  totalSegMins += 2.5;
                }

                totalSegMins += 1.3;

                const s2Name = (s2?.name_tc || '') + ' ' + (s2?.name_en || '');
                if (/過海隧道|紅磡海底隧道|東區海底隧道|西區海底隧道|Cross Harbour Tunnel|Eastern Harbour Crossing|Western Harbour Crossing/i.test(s2Name)) {
                  totalSegMins += 6.0;
                } else if (/大欖隧道|大老山隧道|獅子山隧道|城門隧道|將軍澳隧道|尖山隧道|屯門赤鱲角|Tai Lam Tunnel|Tate's Cairn|Lion Rock|Shing Mun|Tseung Kwan O|Tsing Sha/i.test(s2Name)) {
                  totalSegMins += 4.0;
                } else if (/轉車站|巴士轉乘|收費廣場|Interchange|Toll Plaza/i.test(s2Name)) {
                  totalSegMins += 3.0;
                }
              }

              const minimumFloorMins = Math.ceil(stopCount * 2.5);
              const finalMins = Math.max(minimumFloorMins, Math.round(totalSegMins));

              travelTimeText.textContent = t('travelTimeEstimate', { mins: finalMins, stops: stopCount });
            }
          }
        }

        if (!isAutoRefresh) startAutoRefresh();
      } catch (err) {
        if (!isAutoRefresh) {
          etaContainer.innerHTML = `<span class="text-sm text-rose-600">${t('etaError')}</span>`;
        }
      } finally {
        isFetchingEtaInFlight = false;
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (currentOriginStop) fetchETAAndTravelTime(true);
      }, 3000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
      isFetchingEtaInFlight = false;
    }

    function showRouteList() {
      stopAutoRefresh();
      document.getElementById('routeListView').classList.remove('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
      document.getElementById('stopListView').classList.add('hidden');
      document.getElementById('infoCard').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitleText').textContent = t('appTitle');
    }

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (isLoading) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  </script>
</body>
