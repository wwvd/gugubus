<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gugubus 菇專用香港巴士實時到站查詢 🍄</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 min-h-screen text-stone-800 font-sans">

  <!-- Header -->
  <header class="bg-[#5c3a21] text-amber-100 p-4 shadow-md sticky top-0 z-50 flex justify-between items-center h-[60px] border-b border-[#472c18]">
    <div class="flex items-center space-x-2">
      <button id="backBtn" class="hidden text-sm bg-[#472c18] hover:bg-[#362111] text-amber-200 px-3 py-1.5 rounded-xl transition border border-amber-900/40 flex items-center space-x-1" onclick="showRouteList()">
        <span>←</span>
        <span>返回路線</span>
      </button>
      <h1 class="text-xl font-bold flex items-center space-x-2" id="appTitle">
        <span>🍄</span>
        <span>Gugubus 菇專用香港巴士實時到站查詢</span>
      </h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4">

    <!-- Selected Info Banner -->
    <div id="infoCard" class="hidden sticky top-[60px] z-40 bg-[#fdfbf7]/95 backdrop-blur-md p-4 rounded-2xl shadow-md mb-4 border border-amber-200/80 transition-all">
      <div class="flex justify-between items-start mb-1">
        <div id="selectedRouteHeader" class="flex items-center space-x-2"></div>
        <button id="switchDirBtn" onclick="toggleDirection()" class="text-xs bg-amber-100/80 hover:bg-amber-200/80 text-amber-900 border border-amber-300 px-3 py-1.5 rounded-xl font-semibold transition flex items-center space-x-1 shadow-sm">
          <span>切換方向</span>
          <span>⇄</span>
        </button>
      </div>
      <div id="selectedRouteDir" class="text-sm text-stone-600 mb-3"></div>
      <div id="selectedStopInfo" class="text-md font-semibold text-stone-800 border-t border-amber-200/60 pt-2">請選擇下方車站</div>
      <div id="etaContainer" class="mt-3 flex flex-wrap gap-2"></div>
    </div>

    <!-- Search & Company Filter Section -->
    <div id="searchSection" class="bg-white p-4 rounded-2xl shadow-sm border border-amber-200/70 mb-4 space-y-3">
      <input type="text" id="searchInput" oninput="filterRoutes()" placeholder="搜尋路線 (例如 1, 101, A21, K51, 3M)..." 
        class="w-full px-4 py-2 border border-amber-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-700 focus:border-amber-700 bg-amber-50/20 placeholder-stone-400">
      
      <!-- Company Filter Pills -->
      <div class="flex flex-wrap gap-1.5 text-xs font-semibold pt-1" id="companyPillGroup">
        <button onclick="setCompanyFilter('ALL')" class="pill-btn active px-3 py-1.5 rounded-xl transition border bg-[#7a4831] text-amber-50 border-[#633824]" data-co="ALL">全部</button>
        <button onclick="setCompanyFilter('KMB')" class="pill-btn px-3 py-1.5 rounded-xl transition border bg-amber-100/60 text-stone-700 border-amber-200 hover:bg-amber-200/70" data-co="KMB">九巴</button>
        <button onclick="setCompanyFilter('CTB')" class="pill-btn px-3 py-1.5 rounded-xl transition border bg-amber-100/60 text-stone-700 border-amber-200 hover:bg-amber-200/70" data-co="CTB">城巴</button>
        <button onclick="setCompanyFilter('LWB')" class="pill-btn px-3 py-1.5 rounded-xl transition border bg-amber-100/60 text-stone-700 border-amber-200 hover:bg-amber-200/70" data-co="LWB">龍運</button>
        <button onclick="setCompanyFilter('NLB')" class="pill-btn px-3 py-1.5 rounded-xl transition border bg-amber-100/60 text-stone-700 border-amber-200 hover:bg-amber-200/70" data-co="NLB">嶼巴</button>
        <button onclick="setCompanyFilter('MTRB')" class="pill-btn px-3 py-1.5 rounded-xl transition border bg-amber-100/60 text-stone-700 border-amber-200 hover:bg-amber-200/70" data-co="MTRB">港鐵巴士</button>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="flex flex-col items-center justify-center py-12">
      <div class="text-4xl animate-bounce mb-2">🍄</div>
      <div class="w-10 h-10 border-4 border-amber-700 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-3 text-stone-600 font-medium">實時載入最新路線數據中...</p>
    </div>

    <!-- Route List View -->
    <div id="routeListView" class="space-y-2"></div>

    <!-- Stop List View -->
    <div id="stopListView" class="hidden space-y-2"></div>

  </main>

  <script>
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const CTB_BASE = "https://rt.data.gov.hk/v2/transport/citybus";
    const NLB_BASE = "https://rt.data.gov.hk/v2/transport/nlb";
    const MTR_BASE = "https://rt.data.gov.hk/v1/transport/mtr/bus";

    // Official MTR Bus routes list
    const MTR_ROUTES = [
      { route: '506', origTc: '屯門碼頭', destTc: '兆麟' },
      { route: 'K12', origTc: '大埔墟站', destTc: '八號花園' },
      { route: 'K14', origTc: '大埔超級城', destTc: '大埔墟站' },
      { route: 'K17', origTc: '富善', destTc: '大埔墟站' },
      { route: 'K18', origTc: '廣福', destTc: '大埔墟站' },
      { route: 'K51', origTc: '富泰', destTc: '大欖' },
      { route: 'K51A', origTc: '富泰', destTc: '掃管笏' },
      { route: 'K52', origTc: '屯門站', destTc: '龍鼓灘' },
      { route: 'K52A', origTc: '屯門站', destTc: '曾咀' },
      { route: 'K52P', origTc: '龍鼓灘', destTc: '屯門站' },
      { route: 'K53', origTc: '屯門站', destTc: '掃管笏' },
      { route: 'K54', origTc: '和田邨', destTc: '屯門市中心' },
      { route: 'K58', origTc: '富泰', destTc: '青山灣' },
      { route: 'K65', origTc: '元朗站', destTc: '流浮山' },
      { route: 'K65A', origTc: '天水圍站', destTc: '流浮山' },
      { route: 'K66', origTc: '朗屏', destTc: '大棠黃泥墩村' },
      { route: 'K68', origTc: '元朗工業邨', destTc: '元朗公園' },
      { route: 'K73', origTc: '天恒', destTc: '元朗西' },
      { route: 'K74', origTc: '天水圍', destTc: '凹頭' },
      { route: 'K75A', origTc: '天水圍站', destTc: '洪水橋' },
      { route: 'K75P', origTc: '天瑞', destTc: '洪水橋' },
      { route: 'K75S', origTc: '洪水橋站', destTc: '洪福邨' },
      { route: 'K76', origTc: '天恒', destTc: '天水圍站' },
      { route: 'K76S', origTc: '濕地公園路', destTc: '天水圍站' }
    ];

    let allRoutes = [];
    let currentSelectedRoute = null;
    let currentSelectedStop = null;
    let currentActiveCard = null;
    let autoRefreshTimer = null;
    let activeCompanyFilter = 'ALL';

    const kmbStopMap = new Map();
    const ctbStopMap = new Map();

    async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        clearTimeout(timer);
        return null;
      }
    }

    function cleanStopName(name) {
      if (!name) return '';
      return String(name)
        .replace(/（.*?）|\(.*?\)|【.*?】/g, '')
        .replace(/巴士總站|總站|分站|車站|特別班次|循環線|轉乘站|市中心|廣場|大廈|商場|碼頭|邨|屋邨|公園|花園|鐵路站|港鐵站/g, '')
        .replace(/[，, \-_]/g, '')
        .trim();
    }

    function parseEndpoints(str) {
      if (!str) return { orig: '', dest: '' };
      const clean = String(str).replace(/（.*?）|\(.*?\)|【.*?】/g, '').trim();
      const delimiters = [' > ', '>', ' ⇄ ', '⇄', ' 至 ', '至', ' 往 ', '往', ' – ', '–', ' — ', '—', ' - ', '-'];
      for (const d of delimiters) {
        if (clean.includes(d)) {
          const parts = clean.split(d).map(p => p.trim()).filter(Boolean);
          if (parts.length >= 2) {
            return { orig: parts[0], dest: parts[parts.length - 1] };
          }
        }
      }
      return { orig: clean, dest: clean };
    }

    function isJointRouteNumber(routeNum) {
      if (!routeNum) return false;
      const norm = routeNum.trim().toUpperCase();
      return /^(1\d\d|3\d\d|6\d\d|8\d\d|9\d\d|N1\d\d|N3\d\d|N6\d\d|N8\d\d|N9\d\d|X9\d\d|X1\d\d|[13689]\d\d[A-Z]?|N[13689]\d\d[A-Z]?)$/i.test(norm);
    }

    function isSameRouteGroup(r1, r2) {
      if (!r1?.route || !r2?.route) return false;
      if (r1.route.toUpperCase() !== r2.route.toUpperCase()) return false;
      if (r1.company === r2.company) return true;
      if (!isJointRouteNumber(r1.route)) return false;

      const cOrig1 = cleanStopName(r1.origTc);
      const cDest1 = cleanStopName(r1.destTc);
      const cOrig2 = cleanStopName(r2.origTc);
      const cDest2 = cleanStopName(r2.destTc);

      return (cOrig1 && cOrig2 && (cOrig1.includes(cOrig2) || cOrig2.includes(cOrig1))) ||
             (cDest1 && cDest2 && (cDest1.includes(cDest2) || cDest2.includes(cDest1))) ||
             (cOrig1 && cDest2 && (cOrig1.includes(cDest2) || cDest2.includes(cOrig1))) ||
             (cDest1 && cOrig2 && (cDest1.includes(cOrig2) || cDest2.includes(cOrig1)));
    }

    async function getStopDetail(company, stopId) {
      if (company === 'KMB' || company === 'LWB') {
        if (kmbStopMap.has(stopId)) return kmbStopMap.get(stopId);
        const res = await fetchWithTimeout(`${KMB_BASE}/stop/${stopId}`);
        if (res && res.data) {
          const info = { name: res.data.name_tc || res.data.name_en, lat: parseFloat(res.data.lat), long: parseFloat(res.data.long) };
          kmbStopMap.set(stopId, info);
          return info;
        }
      } else if (company === 'CTB') {
        if (ctbStopMap.has(stopId)) return ctbStopMap.get(stopId);
        const res = await fetchWithTimeout(`${CTB_BASE}/stop/${stopId}`);
        if (res && res.data) {
          const info = { name: res.data.name_tc || res.data.name_en, lat: parseFloat(res.data.lat), long: parseFloat(res.data.long) };
          ctbStopMap.set(stopId, info);
          return info;
        }
      }
      return { name: `巴士站 ${stopId}`, lat: null, long: null };
    }

    window.addEventListener('DOMContentLoaded', fetchAllRoutes);

    async function fetchAllRoutes() {
      showLoading(true);
      kmbStopMap.clear();
      ctbStopMap.clear();

      try {
        const [kmbRes, ctbRes, nlbRes] = await Promise.all([
          fetchWithTimeout(`${KMB_BASE}/route`),
          fetchWithTimeout(`${CTB_BASE}/route/CTB`),
          fetchWithTimeout(`${NLB_BASE}/route.php?action=list`)
        ]);

        const kmbRoutes = ((kmbRes && kmbRes.data) || []).map(r => {
          const isLwb = (r.route && (r.route.startsWith('A') || r.route.startsWith('E') || r.route.startsWith('N') || r.route.startsWith('R') || r.route.startsWith('S'))) && !['101','102','112'].includes(r.route);
          return {
            company: isLwb ? 'LWB' : 'KMB',
            route: r.route ? String(r.route).trim() : '',
            bound: r.bound,
            serviceType: r.service_type || '1',
            origTc: r.orig_tc,
            destTc: r.dest_tc
          };
        });

        const ctbRoutes = ((ctbRes && ctbRes.data) || []).map(r => ({
          company: 'CTB',
          route: r.route ? String(r.route).trim() : '',
          bound: r.bound || 'outbound',
          serviceType: '1',
          origTc: r.orig_tc,
          destTc: r.dest_tc
        }));

        const rawNlb = (nlbRes && (nlbRes.routes || nlbRes.data)) || [];
        const nlbRoutes = rawNlb.map(r => {
          const title = r.routeNameC || r.routeNameS || r.routeNameE || '';
          const parsed = parseEndpoints(title);
          return {
            company: 'NLB',
            route: String(r.routeNo || '').trim(),
            bound: 'outbound',
            serviceType: '1',
            origTc: parsed.orig || '起點',
            destTc: parsed.dest || '終點',
            nlbRouteId: String(r.routeId || '')
          };
        });

        const mtrRoutes = MTR_ROUTES.map(r => ({
          company: 'MTRB',
          route: r.route,
          bound: 'outbound',
          serviceType: '1',
          origTc: r.origTc,
          destTc: r.destTc
        }));

        const combined = [...kmbRoutes, ...ctbRoutes, ...nlbRoutes, ...mtrRoutes];
        const routeGroups = [];

        combined.forEach(r => {
          if (!r.route) return;
          
          let matchedGroup = routeGroups.find(g => isSameRouteGroup(g, r));
          
          if (!matchedGroup) {
            matchedGroup = {
              route: r.route,
              companies: new Set(),
              variants: [],
              origTc: r.origTc || r.route,
              destTc: r.destTc || r.route
            };
            routeGroups.push(matchedGroup);
          }
          
          matchedGroup.companies.add(r.company);
          
          const isDuplicateVariant = matchedGroup.variants.some(v => 
            v.company === r.company && v.bound === r.bound && v.serviceType === r.serviceType && v.nlbRouteId === r.nlbRouteId
          );
          if (!isDuplicateVariant) {
            matchedGroup.variants.push(r);
          }
        });

        allRoutes = routeGroups.map(g => ({
          route: g.route,
          companies: Array.from(g.companies),
          variants: g.variants,
          origTc: g.origTc,
          destTc: g.destTc
        }));

        allRoutes.sort((a, b) => a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' }));
        renderRoutes(allRoutes);
      } catch (err) {
        console.error("Error loading routes:", err);
      } finally {
        showLoading(false);
      }
    }

    function setCompanyFilter(co) {
      activeCompanyFilter = co;
      document.querySelectorAll('#companyPillGroup button').forEach(btn => {
        if (btn.getAttribute('data-co') === co) {
          btn.className = "pill-btn px-3 py-1.5 rounded-xl transition border bg-[#7a4831] text-amber-50 border-[#633824]";
        } else {
          btn.className = "pill-btn px-3 py-1.5 rounded-xl transition border bg-amber-100/60 text-stone-700 border-amber-200 hover:bg-amber-200/70";
        }
      });
      filterRoutes();
    }

    function renderRoutes(routes) {
      const container = document.getElementById('routeListView');
      container.innerHTML = '';

      if (routes.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-stone-500">找不到相關路線 🍄</div>`;
        return;
      }

      routes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl shadow-sm border border-amber-200/60 hover:border-amber-500 hover:shadow-md transition cursor-pointer flex justify-between items-center";
        card.onclick = () => selectRoute(r);

        let badgesHtml = '';
        if (r.companies.includes('KMB')) badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-red-600 text-white mr-1 shadow-sm">九巴</span>`;
        if (r.companies.includes('LWB')) badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-teal-700 text-white mr-1 shadow-sm">龍運</span>`;
        if (r.companies.includes('CTB')) badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-amber-400 text-amber-950 mr-1 shadow-sm">城巴</span>`;
        if (r.companies.includes('NLB')) badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-cyan-700 text-white mr-1 shadow-sm">嶼巴</span>`;
        if (r.companies.includes('MTRB')) badgesHtml += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-indigo-700 text-white mr-1 shadow-sm">港鐵</span>`;

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="flex items-center">${badgesHtml}</div>
            <span class="text-lg font-bold text-stone-900">${r.route}</span>
          </div>
          <div class="text-sm text-stone-600 font-medium">${r.origTc} ⇄ ${r.destTc}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterRoutes() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const filtered = allRoutes.filter(r => {
        const matchesQuery = !query || r.route.toUpperCase().includes(query);
        const matchesCo = (activeCompanyFilter === 'ALL') || r.companies.includes(activeCompanyFilter);
        return matchesQuery && matchesCo;
      });
      renderRoutes(filtered);
    }

    async function selectRoute(mergedRoute) {
      stopAutoRefresh();
      const primaryCompany = mergedRoute.companies[0];
      const primaryVariant = mergedRoute.variants.find(v => v.company === primaryCompany) || mergedRoute.variants[0];

      currentSelectedRoute = {
        route: mergedRoute.route,
        companies: mergedRoute.companies,
        primaryCompany: primaryCompany,
        bound: primaryVariant.bound,
        serviceType: primaryVariant.serviceType || '1',
        origTc: primaryVariant.origTc,
        destTc: primaryVariant.destTc,
        variants: mergedRoute.variants,
        dir: (primaryVariant.bound === 'O' || primaryVariant.bound?.toLowerCase() === 'outbound') ? 'outbound' : 'inbound'
      };

      document.getElementById('routeListView').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('appTitle').innerHTML = `<span>🍄</span><span>路線 ${currentSelectedRoute.route} 車站列表</span>`;

      document.getElementById('infoCard').classList.remove('hidden');

      updateInfoCardUI();
      loadStopsForCurrentRoute();
    }

    function updateInfoCardUI() {
      const headerEl = document.getElementById('selectedRouteHeader');
      
      let companyBadges = '';
      if (currentSelectedRoute.companies.includes('KMB')) companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-red-600 text-white">九巴</span>`;
      if (currentSelectedRoute.companies.includes('LWB')) companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-teal-700 text-white">龍運</span>`;
      if (currentSelectedRoute.companies.includes('CTB')) companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-amber-400 text-amber-950">城巴</span>`;
      if (currentSelectedRoute.companies.includes('NLB')) companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-cyan-700 text-white">嶼巴</span>`;
      if (currentSelectedRoute.companies.includes('MTRB')) companyBadges += `<span class="px-2 py-0.5 rounded-lg font-bold text-xs bg-indigo-700 text-white">港鐵</span>`;

      headerEl.innerHTML = `
        <div class="flex items-center space-x-1">${companyBadges}</div>
        <span class="text-lg font-bold ml-2 text-stone-900">${currentSelectedRoute.route}</span>
      `;

      document.getElementById('selectedRouteDir').textContent = `${currentSelectedRoute.origTc} ➔ ${currentSelectedRoute.destTc}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站查看到站時間";
      document.getElementById('etaContainer').innerHTML = "";
    }

    function toggleDirection() {
      if (!currentSelectedRoute) return;
      stopAutoRefresh();

      const temp = currentSelectedRoute.origTc;
      currentSelectedRoute.origTc = currentSelectedRoute.destTc;
      currentSelectedRoute.destTc = temp;

      currentSelectedRoute.dir = currentSelectedRoute.dir === 'outbound' ? 'inbound' : 'outbound';

      document.getElementById('selectedRouteDir').textContent = `${currentSelectedRoute.origTc} ➔ ${currentSelectedRoute.destTc}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站";
      document.getElementById('etaContainer').innerHTML = "";
      loadStopsForCurrentRoute();
    }

    function getActiveNlbVariant(route) {
      const nlbVars = route.variants.filter(v => v.company === 'NLB');
      if (nlbVars.length === 0) return null;
      if (nlbVars.length === 1) return nlbVars[0];

      const curOrig = cleanStopName(route.origTc);
      const curDest = cleanStopName(route.destTc);

      const match = nlbVars.find(v => {
        const vOrig = cleanStopName(v.origTc);
        const vDest = cleanStopName(v.destTc);
        return (vOrig.includes(curOrig) || curOrig.includes(vOrig)) &&
               (vDest.includes(curDest) || curDest.includes(vDest));
      });

      return match || nlbVars[0];
    }

    async function loadStopsForCurrentRoute() {
      showLoading(true);
      document.getElementById('stopListView').classList.add('hidden');

      try {
        const route = currentSelectedRoute;
        let kmbStopsDetailed = [];
        let ctbStopsDetailed = [];
        let nlbStopsDetailed = [];
        let mtrStopsDetailed = [];

        if (route.companies.includes('KMB') || route.companies.includes('LWB')) {
          const kmbVar = route.variants.find(v => v.company === 'KMB' || v.company === 'LWB') || {};
          const dir = route.dir === 'outbound' ? 'outbound' : 'inbound';
          const res = await fetchWithTimeout(`${KMB_BASE}/route-stop/${route.route}/${dir}/${kmbVar.serviceType || '1'}`);
          const rawStops = (res && res.data) || [];

          kmbStopsDetailed = await Promise.all(rawStops.map(async (s) => {
            const info = await getStopDetail('KMB', s.stop);
            return { stopId: s.stop, seq: s.seq, name: info.name };
          }));
        }

        if (route.companies.includes('CTB')) {
          const dir = route.dir === 'outbound' ? 'outbound' : 'inbound';
          const res = await fetchWithTimeout(`${CTB_BASE}/route-stop/CTB/${route.route}/${dir}`);
          const rawStops = (res && res.data) || [];

          ctbStopsDetailed = await Promise.all(rawStops.map(async (s) => {
            const info = await getStopDetail('CTB', s.stop);
            return { stopId: s.stop, seq: s.seq, name: info.name };
          }));
        }

        if (route.companies.includes('NLB')) {
          const chosenVariant = getActiveNlbVariant(route);
          if (chosenVariant && chosenVariant.nlbRouteId) {
            const res = await fetchWithTimeout(`${NLB_BASE}/stop.php?action=list&routeId=${chosenVariant.nlbRouteId}`);
            const rawStops = (res && (res.stops || res.data)) || [];
            nlbStopsDetailed = rawStops.map((s, idx) => ({
              stopId: String(s.stopId || s.stop_id || ''),
              seq: idx + 1,
              name: s.stopNameC || s.stopNameS || s.stopNameE || `車站 ${idx+1}`,
              nlbRouteId: chosenVariant.nlbRouteId
            }));
          }
        }

        if (route.companies.includes('MTRB')) {
          const res = await fetchWithTimeout(`${MTR_BASE}/getSchedule`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ language: 'zh', routeName: route.route })
          });

          const rawStops = (res && (res.busStop || res.busStops || res.stops)) || [];
          mtrStopsDetailed = rawStops.map((s, idx) => ({
            stopId: String(s.busStopId || s.stopId || s.id || ''),
            seq: parseInt(s.sequence, 10) || idx + 1,
            name: s.busStopNameTC || s.busStopName || s.busStopNameEN || `車站 ${idx+1}`
          }));

          if (route.dir === 'inbound' && mtrStopsDetailed.length > 0) {
            mtrStopsDetailed.reverse();
          }
        }

        let finalStops = [];
        if (kmbStopsDetailed.length > 0) {
          finalStops = kmbStopsDetailed.map(s => ({ seq: s.seq, name: s.name, kmbStopId: s.stopId }));
        } else if (ctbStopsDetailed.length > 0) {
          finalStops = ctbStopsDetailed.map(s => ({ seq: s.seq, name: s.name, ctbStopId: s.stopId }));
        } else if (nlbStopsDetailed.length > 0) {
          finalStops = nlbStopsDetailed.map(s => ({ seq: s.seq, name: s.name, nlbStopId: s.stopId, nlbRouteId: s.nlbRouteId }));
        } else if (mtrStopsDetailed.length > 0) {
          finalStops = mtrStopsDetailed.map(s => ({ seq: s.seq, name: s.name, mtrStopId: s.stopId }));
        }

        finalStops.sort((a, b) => a.seq - b.seq);
        finalStops.forEach((s, idx) => { s.displaySeq = idx + 1; });

        renderStops(finalStops);
      } catch (err) {
        alert("無法加載車站列表。");
      } finally {
        showLoading(false);
      }
    }

    function renderStops(stops) {
      const container = document.getElementById('stopListView');
      container.innerHTML = '';
      container.classList.remove('hidden');

      stops.forEach(s => {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl shadow-sm border border-amber-200/60 hover:border-amber-500 transition cursor-pointer flex items-center space-x-3";
        card.onclick = () => fetchETA(s, card, false);

        card.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs flex-shrink-0 border border-amber-200">
            ${s.displaySeq || s.seq}
          </div>
          <div class="text-md font-medium text-stone-800">${s.name}</div>
        `;
        container.appendChild(card);
      });
    }

    function parseEtaToDate(item, now) {
      if (typeof item.arrivalTimeInSecond === 'number' && !isNaN(item.arrivalTimeInSecond)) {
        return new Date(now.getTime() + item.arrivalTimeInSecond * 1000);
      }
      if (!item.eta) return null;

      let str = String(item.eta).trim();
      if (!str) return null;

      if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(str)) {
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        return new Date(`${yyyy}-${mm}-${dd}T${str}`);
      }

      str = str.replace(' ', 'T');
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    async function fetchETA(stop, activeCard, isAutoRefresh = false) {
      currentSelectedStop = stop;
      currentActiveCard = activeCard;

      document.querySelectorAll('#stopListView > div').forEach(el => {
        el.classList.remove('border-amber-600', 'bg-amber-50/80', 'shadow-md');
      });
      if (activeCard) {
        activeCard.classList.add('border-amber-600', 'bg-amber-50/80', 'shadow-md');
      }

      const seqNum = stop.displaySeq || stop.seq;
      document.getElementById('selectedStopInfo').textContent = `已選車站：${seqNum}. ${stop.name}`;
      const etaContainer = document.getElementById('etaContainer');

      if (!isAutoRefresh) {
        etaContainer.innerHTML = `<span class="text-sm text-stone-500 animate-pulse flex items-center space-x-1"><span>🍄</span><span>查詢實時時間中...</span></span>`;
      }

      try {
        let fetchPromises = [];

        if (stop.kmbStopId) {
          const kmbVar = currentSelectedRoute.variants.find(v => v.company === 'KMB' || v.company === 'LWB') || { serviceType: '1' };
          fetchPromises.push(
            fetchWithTimeout(`${KMB_BASE}/eta/${stop.kmbStopId}/${currentSelectedRoute.route}/${kmbVar.serviceType}`)
              .then(res => ((res && res.data) || []).map(item => ({ ...item, defaultCo: item.co || 'KMB' })))
          );
        }

        if (stop.ctbStopId) {
          fetchPromises.push(
            fetchWithTimeout(`${CTB_BASE}/eta/CTB/${stop.ctbStopId}/${currentSelectedRoute.route}`)
              .then(res => ((res && res.data) || []).map(item => ({ ...item, defaultCo: 'CTB' })))
          );
        }

        if (stop.nlbStopId && stop.nlbRouteId) {
          fetchPromises.push(
            fetchWithTimeout(`${NLB_BASE}/stop.php?action=estimatedArrivals&routeId=${encodeURIComponent(stop.nlbRouteId)}&stopId=${encodeURIComponent(stop.nlbStopId)}&language=zh`)
              .then(res => ((res && (res.estimatedArrivals || res.data)) || []).map(item => ({
                eta: item.estimatedArrivalAt || item.estimatedArrival,
                co: 'NLB',
                defaultCo: 'NLB',
                rmk_tc: item.departed ? '已開出' : (item.noService ? '不提供服務' : '')
              })))
          );
        }

        if (stop.mtrStopId) {
          fetchPromises.push(
            fetchWithTimeout(`${MTR_BASE}/getSchedule`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ language: 'zh', routeName: currentSelectedRoute.route })
            })
              .then(res => {
                let buses = [];
                if (res && Array.isArray(res.busStop)) {
                  const targetStop = res.busStop.find(bs => String(bs.busStopId) === String(stop.mtrStopId));
                  if (targetStop && Array.isArray(targetStop.bus)) {
                    buses = targetStop.bus;
                  }
                }
                return buses.map(b => ({
                  eta: b.arrivalTimeText || b.busArrivalTime || b.departureTimeText,
                  arrivalTimeInSecond: typeof b.arrivalTimeInSecond === 'number' ? b.arrivalTimeInSecond : (parseInt(b.arrivalTimeInSecond, 10) || undefined),
                  co: 'MTRB',
                  defaultCo: 'MTRB',
                  rmk_tc: b.busRemark || b.remarks || ''
                }));
              })
          );
        }

        const results = await Promise.all(fetchPromises);
        const rawEtas = results.flat();
        const now = new Date();

        const formattedEtas = rawEtas
          .filter(item => item && (item.eta || item.arrivalTimeInSecond !== undefined))
          .map(item => {
            const etaDate = parseEtaToDate(item, now);
            if (!etaDate) return null;

            let diffMin = Math.round((etaDate - now) / 60000);
            if (diffMin < 0) {
              if (seqNum === 1 || diffMin >= -3) diffMin = 0;
              else return null;
            }

            const hh = String(etaDate.getHours()).padStart(2, '0');
            const mm = String(etaDate.getMinutes()).padStart(2, '0');
            const co = (item.co && item.co.trim()) ? item.co.trim().toUpperCase() : item.defaultCo;

            return {
              company: co,
              mins: diffMin,
              exactTime: `${hh}:${mm}`,
              rmk: item.rmk_tc || item.rmk_en || '',
              rawTime: etaDate.getTime()
            };
          })
          .filter(item => item !== null);

        const uniqueEtas = [];
        const seen = new Set();
        formattedEtas.forEach(item => {
          const key = `${item.company}-${item.exactTime}-${item.mins}`;
          if (!seen.has(key)) {
            seen.add(key);
            uniqueEtas.push(item);
          }
        });

        uniqueEtas.sort((a, b) => a.rawTime - b.rawTime);
        const nextETAs = uniqueEtas.slice(0, 3);

        etaContainer.innerHTML = '';

        if (nextETAs.length === 0) {
          etaContainer.innerHTML = `<span class="text-sm text-rose-600 font-medium">暫無即時班次資料</span>`;
        } else {
          nextETAs.forEach((item, idx) => {
            const badge = document.createElement('div');
            badge.className = "bg-[#7a4831] text-amber-50 text-sm font-semibold px-3 py-1.5 rounded-xl shadow-sm flex items-center space-x-2 border border-[#633824]";
            
            let durationLabel = item.mins === 0 ? (seqNum === 1 ? '即將開出' : '即將到站') : `${item.mins} 分鐘`;
            let coBg = 'bg-amber-400 text-amber-950';
            let coName = '城巴';

            if (item.company === 'KMB') { coBg = 'bg-red-700 text-white'; coName = '九巴'; }
            else if (item.company === 'LWB') { coBg = 'bg-teal-700 text-white'; coName = '龍運'; }
            else if (item.company === 'NLB') { coBg = 'bg-cyan-700 text-white'; coName = '嶼巴'; }
            else if (item.company === 'MTRB') { coBg = 'bg-indigo-700 text-white'; coName = '港鐵'; }

            const companyBadgeHtml = `<span class="px-1.5 py-0.5 rounded text-xs font-bold ${coBg}">${coName}</span>`;
            const rmkTag = item.rmk ? `<span class="text-xs bg-amber-200/20 px-1.5 py-0.5 rounded text-amber-200 font-normal">${item.rmk}</span>` : '';

            badge.innerHTML = `
              <div class="flex items-center space-x-1.5">
                ${companyBadgeHtml}
                <span>第 ${idx + 1} 班: ${durationLabel} (${item.exactTime})</span>
                ${rmkTag}
              </div>
            `;
            etaContainer.appendChild(badge);
          });
        }

        if (!isAutoRefresh) startAutoRefresh();

      } catch (err) {
        if (!isAutoRefresh) {
          etaContainer.innerHTML = `<span class="text-sm text-rose-600">無法獲取實時數據</span>`;
        }
      }
    }

    function startAutoRefresh() {
      stopAutoRefresh();
      autoRefreshTimer = setInterval(() => {
        if (currentSelectedStop) {
          fetchETA(currentSelectedStop, currentActiveCard, true);
        }
      }, 5000);
    }

    function stopAutoRefresh() {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
    }

    function showRouteList() {
      stopAutoRefresh();
      document.getElementById('routeListView').classList.remove('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
      document.getElementById('stopListView').classList.add('hidden');
      document.getElementById('infoCard').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitle').innerHTML = `<span>🍄</span><span>Gugubus 菇專用香港巴士實時到站查詢</span>`;
    }

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (isLoading) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  </script>
