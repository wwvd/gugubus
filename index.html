<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港巴士實時到站查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <button id="backBtn" class="hidden text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded transition" onclick="showRouteList()">
        返回路線列表
      </button>
      <h1 class="text-lg font-bold" id="appTitle">香港巴士實時到站查詢</h1>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4">

    <!-- 搜尋與篩選區 -->
    <div id="searchSection" class="bg-white p-4 rounded-xl shadow-sm mb-4 space-y-3">
      <div class="flex gap-2">
        <button onclick="setCompanyFilter('ALL')" id="filterAll" class="px-3 py-1 rounded text-sm font-bold bg-blue-600 text-white">全部</button>
        <button onclick="setCompanyFilter('KMB')" id="filterKmb" class="px-3 py-1 rounded text-sm font-bold bg-gray-200 text-gray-700">九巴</button>
        <button onclick="setCompanyFilter('CTB')" id="filterCtb" class="px-3 py-1 rounded text-sm font-bold bg-gray-200 text-gray-700">城巴</button>
      </div>
      <input type="text" id="searchInput" oninput="filterRoutes()" placeholder="輸入路線編號或地名 (例如 1, 101, 觀塘)..." 
        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- 路線詳細資訊 / 到站時間卡片 -->
    <div id="infoCard" class="hidden bg-white p-4 rounded-xl shadow-sm mb-4">
      <div class="flex justify-between items-center mb-2">
        <div id="selectedRouteHeader" class="font-bold text-lg"></div>
        <button onclick="toggleDirection()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded font-bold">切換方向 ⇄</button>
      </div>
      <div id="selectedRouteDir" class="text-sm text-gray-600 mb-3"></div>
      <div id="selectedStopInfo" class="text-sm font-bold text-gray-700 border-t pt-2">請選擇下方車站</div>
      <div id="etaContainer" class="mt-2 flex flex-wrap gap-2"></div>
    </div>

    <!-- 路線列表與車站列表 -->
    <div id="routeListView" class="space-y-2"></div>
    <div id="stopListView" class="hidden space-y-2"></div>

  </main>

  <script>
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const CTB_BASE = "https://rt.data.gov.hk/v2/transport/citybus";

    const ROUTES_DB = [
      { company: 'KMB', companyName: '九巴', route: '1', orig: '竹園邨', dest: '尖沙咀碼頭', bound: 'outbound', serviceType: '1' },
      { company: 'KMB', companyName: '九巴', route: '1A', orig: '中秀茂坪', dest: '尖沙咀碼頭', bound: 'outbound', serviceType: '1' },
      { company: 'KMB', companyName: '九巴', route: '2X', orig: '彩福', dest: '美孚', bound: 'outbound', serviceType: '1' },
      { company: 'KMB', companyName: '九巴', route: '101', orig: '堅尼地城', dest: '觀塘(裕民坊)', bound: 'outbound', serviceType: '1' },
      { company: 'CTB', companyName: '城巴', route: '101', orig: '堅尼地城', dest: '觀塘(裕民坊)', bound: 'outbound' },
      { company: 'KMB', companyName: '九巴', route: '102', orig: '美孚', dest: '筲箕灣', bound: 'outbound', serviceType: '1' },
      { company: 'CTB', companyName: '城巴', route: '102', orig: '美孚', dest: '筲箕灣', bound: 'outbound' },
      { company: 'CTB', companyName: '城巴', route: '1', orig: '摩星嶺', dest: '跑馬地(上)', bound: 'outbound' },
      { company: 'CTB', companyName: '城巴', route: '5B', orig: '堅尼地城', dest: '銅鑼灣', bound: 'outbound' },
      { company: 'KMB', companyName: '九巴', route: '960', orig: '屯門(建生邨)', dest: '灣仔北', bound: 'outbound', serviceType: '1' },
      { company: 'KMB', companyName: '九巴', route: '968', orig: '元朗(西)', dest: '銅鑼灣(天后)', bound: 'outbound', serviceType: '1' }
    ];

    let selectedCompanyFilter = 'ALL';
    let currentSelectedRoute = null;

    function initApp() {
      filterRoutes();
    }

    function renderRoutes(routes) {
      const container = document.getElementById('routeListView');
      container.innerHTML = '';

      if (routes.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-gray-500">找不到相關路線</div>`;
        return;
      }

      routes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-lg shadow-sm hover:shadow transition cursor-pointer flex justify-between items-center";
        card.onclick = () => selectRoute(r);

        const badgeColor = r.company === 'KMB' ? 'bg-red-500 text-white' : 'bg-orange-400 text-white';

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="px-2 py-0.5 rounded text-xs font-bold ${badgeColor}">${r.companyName}</span>
            <span class="text-lg font-bold">${r.route}</span>
          </div>
          <div class="text-sm text-gray-600">${r.orig} ➔ ${r.dest}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterRoutes() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();

      const filtered = ROUTES_DB.filter(r => {
        const matchesCompany = selectedCompanyFilter === 'ALL' || r.company === selectedCompanyFilter;
        if (!matchesCompany) return false;
        if (!query) return true;
        return r.route.toUpperCase().includes(query) || r.orig.toUpperCase().includes(query) || r.dest.toUpperCase().includes(query);
      });

      renderRoutes(filtered);
    }

    function setCompanyFilter(company) {
      selectedCompanyFilter = company;
      ['All', 'Kmb', 'Ctb'].forEach(type => {
        const btn = document.getElementById(`filter${type}`);
        if (btn) {
          if (type.toUpperCase() === company || (type === 'All' && company === 'ALL')) {
            btn.className = "px-3 py-1 rounded text-sm font-bold bg-blue-600 text-white";
          } else {
            btn.className = "px-3 py-1 rounded text-sm font-bold bg-gray-200 text-gray-700";
          }
        }
      });
      filterRoutes();
    }

    async function selectRoute(route) {
      currentSelectedRoute = JSON.parse(JSON.stringify(route));

      document.getElementById('routeListView').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('appTitle').textContent = `${route.companyName} ${route.route} 車站列表`;
      document.getElementById('infoCard').classList.remove('hidden');

      document.getElementById('selectedRouteHeader').textContent = `${route.companyName} ${route.route}`;
      document.getElementById('selectedRouteDir').textContent = `${route.orig} ➔ ${route.dest}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站";
      document.getElementById('etaContainer').innerHTML = "";
      document.getElementById('stopListView').classList.add('hidden');

      try {
        let stopsRaw = [];
        if (route.company === 'KMB') {
          const bound = route.bound === 'inbound' ? 'inbound' : 'outbound';
          const res = await fetch(`${KMB_BASE}/route-stop/${route.route}/${bound}/${route.serviceType || '1'}`);
          const data = await res.json();
          stopsRaw = data.data || [];
        } else if (route.company === 'CTB') {
          const res = await fetch(`${CTB_BASE}/route-stop/ctb/${route.route}/outbound`);
          const data = await res.json();
          stopsRaw = data.data || [];
        }

        const stopPromises = stopsRaw.map(async (s, idx) => {
          let name = `巴士站 ${s.seq || idx + 1}`;
          if (s.stop) {
            const apiBase = route.company === 'KMB' ? KMB_BASE : CTB_BASE;
            try {
              const stopRes = await fetch(`${apiBase}/stop/${s.stop}`);
              const stopData = await stopRes.json();
              if (stopData?.data?.name_tc) name = stopData.data.name_tc;
            } catch (e) {}
          }
          return { seq: s.seq || (idx + 1), name, stopId: s.stop };
        });

        const stops = (await Promise.all(stopPromises)).sort((a, b) => a.seq - b.seq);
        renderStops(stops);
      } catch (err) {
        console.error(err);
      }
    }

    function toggleDirection() {
      if (!currentSelectedRoute) return;
      currentSelectedRoute.bound = currentSelectedRoute.bound === 'inbound' ? 'outbound' : 'inbound';
      const temp = currentSelectedRoute.orig;
      currentSelectedRoute.orig = currentSelectedRoute.dest;
      currentSelectedRoute.dest = temp;
      selectRoute(currentSelectedRoute);
    }

    function renderStops(stops) {
      const container = document.getElementById('stopListView');
      container.innerHTML = '';
      container.classList.remove('hidden');

      stops.forEach(s => {
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-lg shadow-sm hover:shadow transition cursor-pointer flex items-center space-x-3";
        card.onclick = () => fetchETA(s);

        card.innerHTML = `
          <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">${s.seq}</span>
          <span class="font-medium">${s.name}</span>
        `;
        container.appendChild(card);
      });
    }

    async function fetchETA(stop) {
      document.getElementById('selectedStopInfo').textContent = `已選車站：${stop.name}`;
      const etaContainer = document.getElementById('etaContainer');
      etaContainer.innerHTML = `<span class="text-sm text-gray-500">正在查詢時間...</span>`;

      try {
        let rawEtas = [];
        if (currentSelectedRoute.company === 'KMB' && stop.stopId) {
          const res = await fetch(`${KMB_BASE}/eta/${stop.stopId}/${currentSelectedRoute.route}/${currentSelectedRoute.serviceType || '1'}`);
          const data = await res.json();
          rawEtas = data.data || [];
        } else if (currentSelectedRoute.company === 'CTB' && stop.stopId) {
          const res = await fetch(`${CTB_BASE}/eta/ctb/${stop.stopId}/${currentSelectedRoute.route}`);
          const data = await res.json();
          rawEtas = data.data || [];
        }

        const now = new Date();
        const etas = rawEtas
          .filter(item => item && item.eta)
          .map(item => {
            const diffMin = Math.round((new Date(item.eta) - now) / 60000);
            return diffMin >= 0 ? diffMin : 0;
          })
          .slice(0, 3);

        etaContainer.innerHTML = '';
        if (etas.length === 0) {
          etaContainer.innerHTML = `<span class="text-sm text-red-500 font-bold">暫無即時班次資料</span>`;
        } else {
          etas.forEach((mins, idx) => {
            const badge = document.createElement('span');
            badge.className = "bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm";
            badge.textContent = mins === 0 ? `第 ${idx + 1} 班: 即將到站` : `第 ${idx + 1} 班: ${mins} 分鐘`;
            etaContainer.appendChild(badge);
          });
        }
      } catch (err) {
        etaContainer.innerHTML = `<span class="text-sm text-red-500 font-bold">無法獲取實時數據</span>`;
      }
    }

    function showRouteList() {
      document.getElementById('routeListView').classList.remove('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitle').textContent = "香港巴士實時到站查詢";
      document.getElementById('infoCard').classList.add('hidden');
      document.getElementById('stopListView').classList.add('hidden');
    }

    initApp();
  </script>
</body>
</html>
