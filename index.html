<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gugubus 菇專用香港巴士實時到站查詢</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <button id="backBtn" class="hidden text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition" onclick="showRouteList()">
        ← 返回路線
      </button>
      <h1 class="text-xl font-bold" id="appTitle">Gugubus 菇專用香港巴士實時到站查詢</h1>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4">

    <!-- Selected Info Banner -->
    <div id="infoCard" class="hidden bg-white p-4 rounded-xl shadow-md mb-4 border border-gray-200">
      <div class="flex justify-between items-start mb-1">
        <div id="selectedRouteHeader" class="flex items-center space-x-2"></div>
        <!-- Direction Switch Button -->
        <button id="switchDirBtn" onclick="toggleDirection()" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1.5 rounded-lg font-semibold transition flex items-center space-x-1">
          <span>切換方向</span>
          <span>⇄</span>
        </button>
      </div>
      <div id="selectedRouteDir" class="text-sm text-gray-600 mb-3"></div>
      <div id="selectedStopInfo" class="text-md font-semibold text-gray-800 border-t pt-2">請選擇下方車站</div>
      
      <!-- ETA Badges Container -->
      <div id="etaContainer" class="mt-3 flex flex-wrap gap-2"></div>
    </div>

    <!-- Search Section (Route View Only) -->
    <div id="searchSection" class="bg-white p-4 rounded-xl shadow-md mb-4">
      <input type="text" id="searchInput" oninput="filterRoutes()" placeholder="搜尋路線 (例如 1, 1A, 102, 960)..." 
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="flex flex-col items-center justify-center py-12">
      <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-3 text-gray-500 font-medium">載入數據中...</p>
    </div>

    <!-- Route List View -->
    <div id="routeListView" class="space-y-2"></div>

    <!-- Stop List View -->
    <div id="stopListView" class="hidden space-y-2"></div>

  </main>

  <script>
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const CTB_BASE = "https://rt.data.gov.hk/v2/transport/citybus";

    let allRoutes = [];
    let currentSelectedRoute = null;
    let currentSelectedStop = null;

    function normalizeTerminus(name) {
      if (!name) return '';
      return name
        .replace(/（.*?）|\(.*?\)/g, '')
        .replace(/巴士總站|總站|特別班次|（循環線）|\(循環線\)|循環線|轉乘站|站|市中心/g, '')
        .replace(/[\s\-_]+/g, '')
        .trim();
    }

    window.addEventListener('DOMContentLoaded', fetchAllRoutes);

    async function fetchAllRoutes() {
      showLoading(true);
      try {
        const [kmbRes, ctbRes] = await Promise.all([
          fetch(`${KMB_BASE}/route`).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(`${CTB_BASE}/route/CTB`).then(r => r.json()).catch(() => ({ data: [] }))
        ]);

        const kmbRoutes = (kmbRes.data || []).map(r => ({
          company: 'KMB',
          route: r.route ? r.route.trim() : '',
          bound: r.bound,
          serviceType: r.service_type || '1',
          origTc: r.orig_tc,
          destTc: r.dest_tc
        }));

        const ctbRoutes = (ctbRes.data || []).map(r => ({
          company: 'CTB',
          route: r.route ? r.route.trim() : '',
          bound: r.bound || 'outbound',
          serviceType: '1',
          origTc: r.orig_tc,
          destTc: r.dest_tc
        }));

        const combined = [...kmbRoutes, ...ctbRoutes];
        const routeMap = new Map();

        combined.forEach(r => {
          if (!r.route || !r.origTc || !r.destTc) return;
          const routeNum = r.route.toUpperCase();
          
          const origClean = normalizeTerminus(r.origTc);
          const destClean = normalizeTerminus(r.destTc);
          const sortedEnds = [origClean, destClean].sort().join('__');
          
          const mapKey = `${routeNum}:::${sortedEnds}`;

          if (!routeMap.has(mapKey)) {
            routeMap.set(mapKey, {
              route: r.route,
              companies: new Set(),
              variants: []
            });
          }

          const group = routeMap.get(mapKey);
          group.companies.add(r.company);

          const isDuplicateVariant = group.variants.some(v => 
            v.company === r.company && v.bound === r.bound && v.serviceType === r.serviceType
          );

          if (!isDuplicateVariant) {
            group.variants.push(r);
          }
        });

        allRoutes = [];
        routeMap.forEach((group) => {
          const defaultVariant = group.variants.find(v => v.serviceType === '1' && (v.bound === 'O' || v.bound.toLowerCase() === 'outbound')) || group.variants[0];
          allRoutes.push({
            route: group.route,
            companies: Array.from(group.companies),
            variants: group.variants,
            origTc: defaultVariant.origTc,
            destTc: defaultVariant.destTc
          });
        });

        allRoutes.sort((a, b) => a.route.localeCompare(b.route, undefined, { numeric: true, sensitivity: 'base' }));
        renderRoutes(allRoutes);
      } catch (err) {
        alert("無法讀取巴士路線資料。");
      } finally {
        showLoading(false);
      }
    }

    function renderRoutes(routes) {
      const container = document.getElementById('routeListView');
      container.innerHTML = '';

      if (routes.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-gray-500">找不到相關路線</div>`;
        return;
      }

      routes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer flex justify-between items-center";
        card.onclick = () => selectRoute(r);

        let badgesHtml = '';
        if (r.companies.includes('KMB')) {
          badgesHtml += `<span class="px-2 py-1 rounded font-bold text-xs bg-red-600 text-white mr-1">九巴</span>`;
        }
        if (r.companies.includes('CTB')) {
          badgesHtml += `<span class="px-2 py-1 rounded font-bold text-xs bg-yellow-400 text-black">城巴</span>`;
        }

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="flex items-center">${badgesHtml}</div>
            <span class="text-lg font-bold text-gray-900">${r.route}</span>
          </div>
          <div class="text-sm text-gray-600">${r.origTc} ➔ ${r.destTc}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterRoutes() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const filtered = allRoutes.filter(r => !query || r.route.toUpperCase().includes(query));
      renderRoutes(filtered);
    }

    async function selectRoute(mergedRoute) {
      const primaryCompany = mergedRoute.companies.includes('KMB') ? 'KMB' : mergedRoute.companies[0];
      const primaryVariant = mergedRoute.variants.find(v => v.company === primaryCompany) || mergedRoute.variants[0];

      currentSelectedRoute = {
        route: mergedRoute.route,
        companies: mergedRoute.companies,
        primaryCompany: primaryCompany,
        bound: primaryVariant.bound,
        serviceType: primaryVariant.serviceType,
        origTc: primaryVariant.origTc,
        destTc: primaryVariant.destTc,
        variants: mergedRoute.variants
      };
      currentSelectedStop = null;

      document.getElementById('routeListView').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('appTitle').textContent = `路線 ${currentSelectedRoute.route} 車站列表`;

      document.getElementById('infoCard').classList.remove('hidden');

      updateInfoCardUI();
      loadStopsForCurrentRoute();
    }

    function updateInfoCardUI() {
      const headerEl = document.getElementById('selectedRouteHeader');
      
      let companyBadges = '';
      if (currentSelectedRoute.companies.includes('KMB')) {
        companyBadges += `<span class="px-2 py-0.5 rounded font-bold text-xs bg-red-600 text-white">九巴</span>`;
      }
      if (currentSelectedRoute.companies.includes('CTB')) {
        companyBadges += `<span class="px-2 py-0.5 rounded font-bold text-xs bg-yellow-400 text-black">城巴</span>`;
      }

      headerEl.innerHTML = `
        <div class="flex items-center space-x-1">${companyBadges}</div>
        <span class="text-lg font-bold ml-2">${currentSelectedRoute.route}</span>
      `;

      document.getElementById('selectedRouteDir').textContent = `${currentSelectedRoute.origTc} ➔ ${currentSelectedRoute.destTc}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站查看到站時間";
      document.getElementById('etaContainer').innerHTML = "";
    }

    function toggleDirection() {
      if (!currentSelectedRoute) return;

      const temp = currentSelectedRoute.origTc;
      currentSelectedRoute.origTc = currentSelectedRoute.destTc;
      currentSelectedRoute.destTc = temp;

      const currentBound = currentSelectedRoute.bound.toLowerCase();
      const isOutbound = currentBound === 'o' || currentBound === 'outbound';

      const primaryVariants = currentSelectedRoute.variants.filter(v => v.company === currentSelectedRoute.primaryCompany);
      const targetVariant = primaryVariants.find(v => {
        const vBound = v.bound.toLowerCase();
        return (vBound === 'o' || vBound === 'outbound') !== isOutbound;
      }) || primaryVariants[0];

      if (targetVariant) {
        currentSelectedRoute.bound = targetVariant.bound;
        currentSelectedRoute.serviceType = targetVariant.serviceType || '1';
      }

      currentSelectedStop = null;
      document.getElementById('selectedRouteDir').textContent = `${currentSelectedRoute.origTc} ➔ ${currentSelectedRoute.destTc}`;
      document.getElementById('selectedStopInfo').textContent = "請選擇下方車站";
      document.getElementById('etaContainer').innerHTML = "";
      loadStopsForCurrentRoute();
    }

    async function loadStopsForCurrentRoute() {
      showLoading(true);
      document.getElementById('stopListView').classList.add('hidden');

      try {
        const route = currentSelectedRoute;
        const isJoint = route.companies.length > 1;

        // Fetch KMB stops
        let kmbStopsDetailed = [];
        if (route.companies.includes('KMB')) {
          const kmbVar = route.variants.find(v => v.company === 'KMB') || {};
          const isOutbound = (route.primaryCompany === 'KMB' ? route.bound : (kmbVar.bound || 'O')).toUpperCase() === 'O';
          const dir = isOutbound ? 'outbound' : 'inbound';
          const res = await fetch(`${KMB_BASE}/route-stop/${route.route}/${dir}/${kmbVar.serviceType || '1'}`).then(r => r.json());
          const kmbRawStops = res.data || [];

          kmbStopsDetailed = await Promise.all(kmbRawStops.map(async (s) => {
            let name = `巴士站 ${s.seq}`;
            try {
              const stopRes = await fetch(`${KMB_BASE}/stop/${s.stop}`).then(r => r.json());
              name = stopRes.data?.name_tc || name;
            } catch (e) {}
            return { stopId: s.stop, seq: s.seq, name };
          }));
        }

        // Fetch CTB stops
        let ctbStopsDetailed = [];
        if (route.companies.includes('CTB')) {
          const ctbVar = route.variants.find(v => v.company === 'CTB') || {};
          const isOutbound = (route.primaryCompany === 'CTB' ? route.bound : (ctbVar.bound || 'outbound')).toLowerCase() === 'outbound';
          const dir = isOutbound ? 'outbound' : 'inbound';
          const res = await fetch(`${CTB_BASE}/route-stop/CTB/${route.route}/${dir}`).then(r => r.json());
          const ctbRawStops = res.data || [];

          ctbStopsDetailed = await Promise.all(ctbRawStops.map(async (s) => {
            let name = `巴士站 ${s.seq}`;
            try {
              const stopRes = await fetch(`${CTB_BASE}/stop/${s.stop}`).then(r => r.json());
              name = stopRes.data?.name_tc || name;
            } catch (e) {}
            return { stopId: s.stop, seq: s.seq, name };
          }));
        }

        // Merge stops by matching stop names for joint routes
        let finalStops = [];
        if (isJoint && kmbStopsDetailed.length > 0 && ctbStopsDetailed.length > 0) {
          finalStops = kmbStopsDetailed.map((kStop, index) => {
            const kNorm = normalizeTerminus(kStop.name);
            const matchedCtb = ctbStopsDetailed.find(cStop => normalizeTerminus(cStop.name) === kNorm) || ctbStopsDetailed[index];
            return {
              seq: kStop.seq,
              name: kStop.name,
              kmbStopId: kStop.stopId,
              ctbStopId: matchedCtb ? matchedCtb.stopId : null
            };
          });
        } else if (kmbStopsDetailed.length > 0) {
          finalStops = kmbStopsDetailed.map(s => ({ seq: s.seq, name: s.name, kmbStopId: s.stopId, ctbStopId: null }));
        } else {
          finalStops = ctbStopsDetailed.map(s => ({ seq: s.seq, name: s.name, kmbStopId: null, ctbStopId: s.stopId }));
        }

        renderStops(finalStops.sort((a, b) => a.seq - b.seq));
      } catch (err) {
        alert("無法加載車站列表。");
      } finally {
        showLoading(false);
      }
    }

    function renderStops(stops) {
      const container = document.getElementById('stopListView');
      container.innerHTML = '';
      container.classList.remove('hidden');

      stops.forEach(s => {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 hover:border-blue-300 transition cursor-pointer flex items-center space-x-3";
        card.onclick = () => fetchETA(s, card);

        card.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs flex-shrink-0">
            ${s.seq}
          </div>
          <div class="text-md font-medium text-gray-800">${s.name}</div>
        `;
        container.appendChild(card);
      });
    }

    async function fetchETA(stop, activeCard) {
      currentSelectedStop = stop;

      document.querySelectorAll('#stopListView > div').forEach(el => el.classList.remove('border-blue-500', 'bg-blue-50'));
      if (activeCard) activeCard.classList.add('border-blue-500', 'bg-blue-50');

      document.getElementById('selectedStopInfo').textContent = `已選車站：${stop.seq}. ${stop.name}`;
      const etaContainer = document.getElementById('etaContainer');
      etaContainer.innerHTML = `<span class="text-sm text-gray-500 animate-pulse">查詢實時時間中...</span>`;

      try {
        let fetchPromises = [];

        if (stop.kmbStopId) {
          const kmbVar = currentSelectedRoute.variants.find(v => v.company === 'KMB') || { serviceType: '1' };
          fetchPromises.push(
            fetch(`${KMB_BASE}/eta/${stop.kmbStopId}/${currentSelectedRoute.route}/${kmbVar.serviceType}`)
              .then(r => r.json())
              .then(res => (res.data || []).map(item => ({ ...item, co: 'KMB' })))
              .catch(() => [])
          );
        }

        if (stop.ctbStopId) {
          fetchPromises.push(
            fetch(`${CTB_BASE}/eta/CTB/${stop.ctbStopId}/${currentSelectedRoute.route}`)
              .then(r => r.json())
              .then(res => (res.data || []).map(item => ({ ...item, co: 'CTB' })))
              .catch(() => [])
          );
        }

        const results = await Promise.all(fetchPromises);
        const now = new Date();

        const allEtas = results.flat()
          .filter(item => item && item.eta)
          .map(item => {
            const etaDate = new Date(item.eta);
            const diffMin = Math.round((etaDate - now) / 60000);
            if (diffMin < 0) return null;

            const hh = String(etaDate.getHours()).padStart(2, '0');
            const mm = String(etaDate.getMinutes()).padStart(2, '0');
            return {
              company: item.co,
              mins: diffMin,
              exactTime: `${hh}:${mm}`
            };
          })
          .filter(item => item !== null);

        // Deduplicate identical ETAs
        const uniqueEtas = [];
        const seenKeys = new Set();
        allEtas.forEach(item => {
          const key = `${item.company}-${item.exactTime}-${item.mins}`;
          if (!seenKeys.has(key)) {
            seenKeys.add(key);
            uniqueEtas.push(item);
          }
        });

        uniqueEtas.sort((a, b) => a.mins - b.mins);
        const nextETAs = uniqueEtas.slice(0, 4);

        etaContainer.innerHTML = '';

        if (nextETAs.length === 0) {
          etaContainer.innerHTML = `<span class="text-sm text-red-500 font-medium">暫無即時班次資料</span>`;
        } else {
          nextETAs.forEach((item, idx) => {
            const badge = document.createElement('div');
            badge.className = "bg-blue-600 text-white text-sm font-semibold px-3 py-1.5 rounded-lg shadow-sm flex items-center space-x-2";
            
            const durationLabel = item.mins === 0 ? '即將到站' : `${item.mins} 分鐘`;
            const isKmb = item.company === 'KMB';
            const coBg = isKmb ? 'bg-red-700 text-white' : 'bg-yellow-400 text-black';
            const coName = isKmb ? '九巴' : '城巴';
            const companyBadgeHtml = `<span class="px-1.5 py-0.5 rounded text-xs font-bold ${coBg}">${coName}</span>`;

            badge.innerHTML = `
              <div class="flex items-center space-x-1.5">
                ${companyBadgeHtml}
                <span>第 ${idx + 1} 班: ${durationLabel} (${item.exactTime})</span>
              </div>
            `;
            etaContainer.appendChild(badge);
          });
        }
      } catch (err) {
        etaContainer.innerHTML = `<span class="text-sm text-red-500">無法獲取實時數據</span>`;
      }
    }

    function showRouteList() {
      document.getElementById('routeListView').classList.remove('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
      document.getElementById('stopListView').classList.add('hidden');
      document.getElementById('infoCard').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitle').textContent = "Gugubus 菇專用香港巴士實時到站查詢";
    }

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (isLoading) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  </script>
</body>
</html>
