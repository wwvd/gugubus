<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍄 Gugubus 菇專用香港巴士實時到站查詢</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 可愛圓體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', system-ui, -apple-system, sans-serif;
    }
    .mushroom-gradient {
      background: linear-gradient(135deg, #8c533e 0%, #b36b4d 50%, #d9825b 100%);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #d6c5b3;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-[#FAF6F0] min-h-screen text-[#4A3B32] antialiased">

  <!-- 可愛菇菇 Header -->
  <header class="mushroom-gradient text-amber-50 p-4 shadow-lg sticky top-0 z-50 rounded-b-2xl">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <button id="backBtn" class="hidden text-sm bg-[#5C3627]/40 hover:bg-[#5C3627]/60 text-amber-100 px-3 py-1.5 rounded-full transition-all border border-amber-200/30 flex items-center gap-1 shadow-sm" onclick="showRouteList()">
          <span>🍄</span>
          <span>返回路線</span>
        </button>
        <h1 class="text-lg md:text-xl font-black tracking-wide flex items-center gap-2 drop-shadow-sm" id="appTitle">
          <span>🍄</span>
          <span>Gugubus 菇專用香港巴士實時到站</span>
        </h1>
      </div>
      <span class="text-xs bg-amber-100/20 text-amber-100 px-2.5 py-1 rounded-full border border-amber-100/30 hidden sm:inline-block">
        小菇陪伴你搭車 🚌
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-4">

    <!-- Selected Route / ETA Card -->
    <div id="infoCard" class="hidden bg-[#FFFDF9] p-5 rounded-2xl shadow-md mb-4 border-2 border-[#EADBC8] transition-all">
      <div class="flex justify-between items-start mb-2">
        <div id="selectedRouteHeader" class="flex items-center space-x-2"></div>
        <!-- Direction Switch Button -->
        <button id="switchDirBtn" onclick="toggleDirection()" class="text-xs bg-[#F4ECE1] hover:bg-[#E8DCCB] text-[#8C533E] border border-[#D8C4B0] px-3 py-1.5 rounded-full font-bold transition flex items-center space-x-1 shadow-sm hover:scale-105 active:scale-95">
          <span>切換方向</span>
          <span class="text-sm">⇄</span>
        </button>
      </div>
      <div id="selectedRouteDir" class="text-sm font-semibold text-[#8C7A6B] mb-3"></div>
      
      <div id="selectedStopInfo" class="text-base font-bold text-[#5C4A3E] border-t border-[#F0E6D8] pt-3 flex items-center gap-1">
        請選擇下方車站
      </div>
      
      <!-- ETA Badges Container -->
      <div id="etaContainer" class="mt-3 flex flex-wrap gap-2.5"></div>
    </div>

    <!-- Search and Filter Section -->
    <div id="searchSection" class="bg-[#FFFDF9] p-4 rounded-2xl shadow-sm mb-4 border border-[#EADBC8] space-y-3">
      <!-- Filter Buttons -->
      <div class="flex space-x-2">
        <button onclick="setCompanyFilter('ALL')" id="filterAll" class="px-3.5 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#8C533E] text-amber-50 shadow-sm transition">全部路線</button>
        <button onclick="setCompanyFilter('KMB')" id="filterKmb" class="px-3.5 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#F0E6D8] text-[#7A6251] hover:bg-[#E2D2C0] transition">九巴 KMB</button>
        <button onclick="setCompanyFilter('CTB')" id="filterCtb" class="px-3.5 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#F0E6D8] text-[#7A6251] hover:bg-[#E2D2C0] transition">城巴 CTB</button>
      </div>
      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="searchInput" oninput="filterRoutes()" placeholder="搜尋巴士路線 (例如 1A, 101, 960)..." 
          class="w-full px-4 py-2.5 bg-[#FAF6F0] border-2 border-[#E2D2C0] rounded-xl focus:outline-none focus:border-[#8C533E] focus:bg-white text-sm font-semibold text-[#4A3B32] placeholder-[#A8988B] transition">
        <span class="absolute right-3.5 top-2.5 text-base">🔍</span>
      </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="flex flex-col items-center justify-center py-16">
      <div class="text-4xl animate-bounce mb-2">🍄</div>
      <p class="text-[#8C6D58] font-bold text-sm tracking-wider">小菇努力載入數據中...</p>
    </div>

    <!-- Route List View -->
    <div id="routeListView" class="space-y-2.5"></div>

    <!-- Stop List View -->
    <div id="stopListView" class="hidden space-y-2.5"></div>

  </main>

  <script>
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const CTB_BASE = "https://rt.data.gov.hk/v2/transport/citybus";

    let allRoutes = [];
    let selectedCompanyFilter = 'ALL';
    let currentSelectedRoute = null;
    let currentSelectedStop = null;

    // Initialization
    window.addEventListener('DOMContentLoaded', fetchAllRoutes);

    async function fetchAllRoutes() {
      showLoading(true);
      try {
        const [kmbRes, ctbRes] = await Promise.all([
          fetch(`${KMB_BASE}/route`).then(r => r.json()).catch(() => ({ data: [] })),
          fetch(`${CTB_BASE}/route/ctb`).then(r => r.json()).catch(() => ({ data: [] }))
        ]);

        const kmbRoutes = (kmbRes.data || []).map(r => ({
          company: 'KMB',
          route: r.route,
          bound: r.bound,
          serviceType: r.service_type,
          origTc: r.orig_tc,
          destTc: r.dest_tc
        }));

        const ctbRoutes = (ctbRes.data || []).map(r => ({
          company: 'CTB',
          route: r.route,
          bound: 'outbound',
          serviceType: '1',
          origTc: r.orig_tc,
          destTc: r.dest_tc
        }));

        // Deduplicate routes
        const combined = [...kmbRoutes, ...ctbRoutes];
        const uniqueKeys = new Set();
        allRoutes = combined.filter(r => {
          const key = `${r.company}-${r.route}-${r.bound}`;
          if (uniqueKeys.has(key)) return false;
          uniqueKeys.add(key);
          return true;
        });

        renderRoutes(allRoutes);
      } catch (err) {
        alert("無法讀取巴士路線資料。");
      } finally {
        showLoading(false);
      }
    }

    function renderRoutes(routes) {
      const container = document.getElementById('routeListView');
      container.innerHTML = '';

      if (routes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-[#FFFDF9] rounded-2xl border border-[#EADBC8] p-6">
            <span class="text-3xl block mb-2">🍄💧</span>
            <p class="text-[#8C6D58] font-bold">找不到相關路線喔～</p>
          </div>`;
        return;
      }

      routes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-[#FFFDF9] hover:bg-[#FDF9F3] p-4 rounded-2xl shadow-sm border border-[#EADBC8] hover:border-[#D8C4B0] hover:shadow-md transition-all cursor-pointer flex justify-between items-center group transform hover:-translate-y-0.5";
        card.onclick = () => selectRoute(r);

        const badgeStyle = r.company === 'KMB' 
          ? 'bg-[#D9534F] text-white' 
          : 'bg-[#F0AD4E] text-[#332211]';

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="px-2.5 py-1 rounded-lg font-black text-xs ${badgeStyle} shadow-sm">${r.company === 'KMB' ? '九巴' : '城巴'}</span>
            <span class="text-xl font-black text-[#4A3B32] group-hover:text-[#8C533E] transition">${r.route}</span>
          </div>
          <div class="text-xs md:text-sm font-bold text-[#8C7A6B] flex items-center gap-1">
            <span>${r.origTc}</span>
            <span class="text-[#D9825B]">➔</span>
            <span>${r.destTc}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterRoutes() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const filtered = allRoutes.filter(r => {
        const matchesCompany = selectedCompanyFilter === 'ALL' || r.company === selectedCompanyFilter;
        const matchesQuery = !query || r.route.toUpperCase().includes(query);
        return matchesCompany && matchesQuery;
      });
      renderRoutes(filtered);
    }

    function setCompanyFilter(company) {
      selectedCompanyFilter = company;
      ['All', 'Kmb', 'Ctb'].forEach(type => {
        const btn = document.getElementById(`filter${type}`);
        if (type.toUpperCase() === company || (type === 'All' && company === 'ALL')) {
          btn.className = "px-3.5 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#8C533E] text-amber-50 shadow-sm transition";
        } else {
          btn.className = "px-3.5 py-1.5 rounded-full text-xs md:text-sm font-bold bg-[#F0E6D8] text-[#7A6251] hover:bg-[#E2D2C0] transition";
        }
      });
      filterRoutes();
    }

    async function selectRoute(route) {
      currentSelectedRoute = route;
      currentSelectedStop = null;

      document.getElementById('routeListView').classList.add('hidden');
      document.getElementById('searchSection').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      document.getElementById('appTitle').innerHTML = `<span>🍄</span><span>路線 ${route.route} 車站列表</span>`;

      const infoCard = document.getElementById('infoCard');
      infoCard.classList.remove('hidden');

      const badgeStyle = route.company === 'KMB' ? 'bg-[#D9534F] text-white' : 'bg-[#F0AD4E] text-[#332211]';
      document.getElementById('selectedRouteHeader').innerHTML = `
        <span class="px-2.5 py-0.5 rounded-lg font-black text-xs ${badgeStyle}">${route.company === 'KMB' ? '九巴' : '城巴'}</span>
        <span class="text-xl font-black text-[#4A3B32]">${route.route}</span>
      `;
      document.getElementById('selectedRouteDir').textContent = `${route.origTc} ➔ ${route.destTc}`;
      document.getElementById('selectedStopInfo').innerHTML = `<span>🍄</span><span>請選擇下方車站查看到站時間</span>`;
      document.getElementById('etaContainer').innerHTML = "";

      showLoading(true);
      document.getElementById('stopListView').classList.add('hidden');

      try {
        const isOutbound = route.bound.toLowerCase() === 'o' || route.bound.toLowerCase() === 'outbound';
        const dir = isOutbound ? 'outbound' : 'inbound';
        let routeStops = [];

        if (route.company === 'KMB') {
          const res = await fetch(`${KMB_BASE}/route-stop/${route.route}/${dir}/${route.serviceType}`).then(r => r.json());
          routeStops = res.data || [];
        } else {
          const res = await fetch(`${CTB_BASE}/route-stop/ctb/${route.route}/${dir}`).then(r => r.json());
          routeStops = res.data || [];
        }

        const stopPromises = routeStops.map(async (s) => {
          let name = `巴士站 ${s.seq}`;
          try {
            const url = route.company === 'KMB' 
              ? `${KMB_BASE}/stop/${s.stop}` 
              : `${CTB_BASE}/stop/${s.stop}`;
            const stopRes = await fetch(url).then(r => r.json());
            name = stopRes.data?.name_tc || name;
          } catch (e) {}
          return { stopId: s.stop, seq: s.seq, name };
        });

        const stops = (await Promise.all(stopPromises)).sort((a, b) => a.seq - b.seq);
        renderStops(stops);
      } catch (err) {
        alert("無法加載車站列表。");
      } finally {
        showLoading(false);
      }
    }

    function toggleDirection() {
      if (!currentSelectedRoute) return;

      if (currentSelectedRoute.bound.toLowerCase() === 'o' || currentSelectedRoute.bound.toLowerCase() === 'outbound') {
        currentSelectedRoute.bound = currentSelectedRoute.company === 'KMB' ? 'I' : 'inbound';
      } else {
        currentSelectedRoute.bound = currentSelectedRoute.company === 'KMB' ? 'O' : 'outbound';
      }

      const temp = currentSelectedRoute.origTc;
      currentSelectedRoute.origTc = currentSelectedRoute.destTc;
      currentSelectedRoute.destTc = temp;

      selectRoute(currentSelectedRoute);
    }

    function renderStops(stops) {
      const container = document.getElementById('stopListView');
      container.innerHTML = '';
      container.classList.remove('hidden');

      stops.forEach(s => {
        const card = document.createElement('div');
        card.id = `stop-card-${s.stopId}`;
        card.className = "bg-[#FFFDF9] p-3.5 rounded-2xl shadow-sm border border-[#EADBC8] hover:border-[#B36B4D] transition-all cursor-pointer flex items-center space-x-3 group";
        card.onclick = () => fetchETA(s);

        card.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-[#F5EBE0] text-[#8C533E] group-hover:bg-[#8C533E] group-hover:text-amber-50 transition flex items-center justify-center font-black text-xs flex-shrink-0">
            ${s.seq}
          </div>
          <div class="text-sm md:text-base font-bold text-[#4A3B32] group-hover:text-[#8C533E] transition">${s.name}</div>
        `;
        container.appendChild(card);
      });
    }

    // Helper function to resolve company name from ETA data item
    function getOperatingCompany(item, defaultCompany) {
      let co = (item.co || '').toUpperCase();
      let rmk = item.rmk_tc || '';

      if (co === 'KMB' || rmk.includes('九巴')) return { code: 'KMB', name: '九巴' };
      if (co === 'CTB' || co === 'NWFB' || rmk.includes('城巴') || rmk.includes('新巴')) return { code: 'CTB', name: '城巴' };
      if (co === 'LDB' || rmk.includes('龍運')) return { code: 'LWB', name: '龍運' };
      if (co === 'NLB' || rmk.includes('嶼巴')) return { code: 'NLB', name: '嶼巴' };

      // Fallback to route's default company
      return defaultCompany === 'KMB' ? { code: 'KMB', name: '九巴' } : { code: 'CTB', name: '城巴' };
    }

    async function fetchETA(stop) {
      currentSelectedStop = stop;

      document.querySelectorAll('#stopListView > div').forEach(el => {
        el.className = "bg-[#FFFDF9] p-3.5 rounded-2xl shadow-sm border border-[#EADBC8] hover:border-[#B36B4D] transition-all cursor-pointer flex items-center space-x-3 group";
      });
      const activeCard = document.getElementById(`stop-card-${stop.stopId}`);
      if (activeCard) {
        activeCard.className = "bg-[#FDF5EB] p-3.5 rounded-2xl shadow-md border-2 border-[#B36B4D] transition-all cursor-pointer flex items-center space-x-3 group scale-[1.01]";
      }

      document.getElementById('selectedStopInfo').innerHTML = `<span>📍</span><span>已選車站：${stop.seq}. ${stop.name}</span>`;
      const etaContainer = document.getElementById('etaContainer');
      etaContainer.innerHTML = `<span class="text-xs font-bold text-[#8C6D58] animate-pulse flex items-center gap-1"><span>🍄</span> 正在為菇菇查詢實時時間...</span>`;

      try {
        let etaData = [];
        if (currentSelectedRoute.company === 'KMB') {
          const res = await fetch(`${KMB_BASE}/eta/${stop.stopId}/${currentSelectedRoute.route}/${currentSelectedRoute.serviceType}`).then(r => r.json());
          etaData = res.data || [];
        } else {
          const res = await fetch(`${CTB_BASE}/eta/ctb/${stop.stopId}/${currentSelectedRoute.route}`).then(r => r.json());
          etaData = res.data || [];
        }

        const now = new Date();
        const nextThree = etaData
          .filter(item => item.eta)
          .map(item => {
            const etaDate = new Date(item.eta);
            const diffMin = Math.round((etaDate - now) / 60000);
            if (diffMin < 0) return null;

            const hh = String(etaDate.getHours()).padStart(2, '0');
            const mm = String(etaDate.getMinutes()).padStart(2, '0');
            const exactTime = `${hh}:${mm}`;
            
            // Determine operating company from API record
            const companyObj = getOperatingCompany(item, currentSelectedRoute.company);

            return { mins: diffMin, exactTime, company: companyObj };
          })
          .filter(item => item !== null)
          .sort((a, b) => a.mins - b.mins)
          .slice(0, 3);

        etaContainer.innerHTML = '';
        if (nextThree.length === 0) {
          etaContainer.innerHTML = `<span class="text-xs font-bold text-[#D9534F]">暫無即時班次資料 💧</span>`;
        } else {
          nextThree.forEach((item, idx) => {
            const badge = document.createElement('div');
            badge.className = "mushroom-gradient text-amber-50 text-xs md:text-sm font-extrabold px-3 py-2 rounded-xl shadow-sm flex items-center gap-2";
            const durationLabel = item.mins === 0 ? '即將到站' : `${item.mins} 分鐘`;
            
            const companyTagStyle = item.company.code === 'KMB' 
              ? 'bg-[#D9534F] text-white' 
              : 'bg-[#F0AD4E] text-[#332211]';

            badge.innerHTML = `
              <div class="flex items-center gap-1">
                <span>🍄</span>
                <span>第 ${idx + 1} 班: ${durationLabel} (${item.exactTime})</span>
              </div>
              <span class="px-1.5 py-0.5 rounded text-[11px] font-black ${companyTagStyle} shadow-xs">
                ${item.company.name}
              </span>
            `;
            etaContainer.appendChild(badge);
          });
        }
      } catch (err) {
        etaContainer.innerHTML = `<span class="text-xs font-bold text-[#D9534F]">無法獲取實時數據 💧</span>`;
      }
    }

    function showRouteList() {
      document.getElementById('routeListView').classList.remove('hidden');
      document.getElementById('searchSection').classList.remove('hidden');
      document.getElementById('stopListView').classList.add('hidden');
      document.getElementById('infoCard').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('appTitle').innerHTML = `<span>🍄</span><span>Gugubus 菇專用香港巴士實時到站</span>`;
    }

    function showLoading(isLoading) {
      const loader = document.getElementById('loading');
      if (isLoading) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }
  </script>
</body>
</html>
